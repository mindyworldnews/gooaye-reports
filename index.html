<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>股癌分析器</title>
<style>
:root {
  --green:#16a34a;--green-bg:#f0fdf4;--green-border:#bbf7d0;
  --red:#dc2626;--red-bg:#fef2f2;--red-border:#fecaca;
  --gray:#6b7280;--gray-bg:#f9fafb;
  --blue:#2563eb;--radius:12px;
  --font:-apple-system,"Noto Sans TC",sans-serif;
  --sidebar:270px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:#f3f4f6;color:#111827;font-size:16px;line-height:1.6;display:flex;height:100dvh;overflow:hidden}

/* ── Sidebar ── */
#sidebar{width:var(--sidebar);flex-shrink:0;background:#1e293b;color:#f1f5f9;display:flex;flex-direction:column;height:100dvh;overflow:hidden;transition:transform .25s;z-index:200}
#sidebar-header{padding:16px;font-weight:700;font-size:1rem;border-bottom:1px solid #334155;flex-shrink:0}
.tab-bar{display:flex;border-bottom:1px solid #334155;flex-shrink:0}
.tab{flex:1;padding:10px;background:none;border:none;color:#94a3b8;font-size:0.85rem;cursor:pointer;font-weight:600}
.tab.active{color:#f1f5f9;border-bottom:2px solid #38bdf8}
#tab-episodes{overflow-y:auto;flex:1}
#tab-watchlist{overflow-y:auto;flex:1;display:none;padding:8px}
.ep-item{padding:12px 16px;cursor:pointer;border-bottom:1px solid #334155;transition:background .15s}
.ep-item:hover,.ep-item.active{background:#334155}
.ep-date{font-size:0.72rem;color:#94a3b8;margin-bottom:2px}
.ep-title{font-size:0.88rem;font-weight:500;line-height:1.3}

/* ── Watchlist ── */
.wl-item{background:#334155;border-radius:10px;padding:12px;margin-bottom:8px}
.wl-top{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.wl-name{font-size:0.85rem;color:#cbd5e1;margin-bottom:2px}
.wl-from{font-size:0.72rem;color:#64748b}
.wl-remove{margin-top:6px;background:none;border:1px solid #475569;color:#94a3b8;border-radius:6px;padding:2px 8px;font-size:0.75rem;cursor:pointer}
.wl-remove:hover{background:#475569}
.wl-empty{color:#64748b;font-size:0.85rem;text-align:center;padding:24px 8px}

/* ── Overlay (mobile) ── */
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100}

/* ── Main ── */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
#topbar{background:#fff;border-bottom:1px solid #e5e7eb;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0}
#hamburger{background:none;border:none;font-size:1.3rem;cursor:pointer;display:none;color:#374151}
#current-title{font-size:0.95rem;font-weight:600;color:#111827;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#content{flex:1;overflow-y:auto;padding:16px}
#content .container{max-width:680px;margin:0 auto}

/* ── Episode content styles (copied from standalone) ── */
.header{background:#111827;color:#fff;border-radius:var(--radius);padding:20px;margin-bottom:16px}
.header h1{font-size:1.25rem;font-weight:700;margin-bottom:4px}
.header .meta{font-size:0.8rem;color:#9ca3af}
.summary-box{background:#fff;border-radius:var(--radius);padding:16px;margin-bottom:16px;border-left:4px solid #2563eb}
.summary-box p{color:#374151;font-size:0.95rem}
.quick-bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.quick-tag{padding:6px 12px;border-radius:20px;font-size:0.85rem;font-weight:600}
.quick-tag.bullish{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
.quick-tag.bearish{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}
.quick-tag.vague{background:#f5f3ff;color:#7c3aed;border:1px solid #ddd6fe}
.section-title{font-size:0.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#6b7280;margin:20px 0 10px}
.card{background:#fff;border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;border-left:4px solid #e5e7eb}
.card.bullish{border-left-color:var(--green)}
.card.bearish{border-left-color:var(--red)}
.card.neutral{border-left-color:#d1d5db}
.card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;gap:8px}
.stock-name{font-weight:700;font-size:1rem}
.card-meta{display:flex;gap:4px;align-items:center;flex-shrink:0;flex-wrap:wrap}
code.ticker{background:#1e293b;color:#e2e8f0;font-size:0.8rem;padding:2px 7px;border-radius:6px;font-family:monospace}
a.chart-btn{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:5px;margin-left:4px;background:#e0f2fe;color:#0369a1;vertical-align:middle;text-decoration:none}
a.chart-btn:hover{background:#bae6fd}
.market-tag{background:#e0e7ff;color:#3730a3;font-size:0.75rem;padding:2px 6px;border-radius:6px}
.reason{font-size:0.9rem;color:#374151;margin-top:6px}
blockquote{font-size:0.82rem;color:#6b7280;margin-top:6px;padding-left:10px;border-left:2px solid #d1d5db;font-style:italic}
.empty{color:#9ca3af;font-size:0.9rem;text-align:center;padding:16px}
.badge{display:inline-block;font-size:0.78rem;font-weight:600;padding:2px 8px;border-radius:20px}
.badge.bullish{background:var(--green-bg);color:var(--green)}
.badge.bearish{background:var(--red-bg);color:var(--red)}
.badge.neutral{background:var(--gray-bg);color:var(--gray)}
.badge.mention{background:#eff6ff;color:var(--blue)}
.macro-row{background:#fff;border-radius:var(--radius);padding:12px 14px;margin-bottom:8px}
.macro-topic{font-weight:600;font-size:0.9rem;margin-bottom:4px}
.macro-view{font-size:0.88rem;color:#374151}
.sector-chip{background:#fff;border-radius:var(--radius);padding:10px 14px;margin-bottom:8px;font-size:0.88rem}
.sector-reason{color:#6b7280}
.vague-card{background:#fff;border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;border-left:4px solid #a78bfa}
.vague-card.bullish{border-left-color:var(--green)}
.vague-card.bearish{border-left-color:var(--red)}
.vague-header{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.vague-term{font-weight:700;font-size:1rem;color:#111827}
.vague-interp{font-size:0.88rem;color:#374151;margin-bottom:6px}
.cand-list{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.cand-row{font-size:0.85rem;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px;padding:6px 10px;background:#f8fafc;border-radius:8px}
.cand-name{font-weight:600}
.cand-reason{color:#6b7280}
.wl-btn{background:none;border:none;cursor:pointer;font-size:1rem;padding:0 2px;line-height:1;opacity:.5;transition:opacity .15s}
.wl-btn:hover,.wl-btn.in-wl{opacity:1}
.wl-btn-sm{font-size:0.8rem;margin-left:4px}
.footer{text-align:center;font-size:0.75rem;color:#9ca3af;padding:24px 0 8px}

/* ── Mobile ── */
@media(max-width:700px){
  #sidebar{position:fixed;left:0;top:0;height:100dvh;transform:translateX(-100%)}
  #sidebar.open{transform:translateX(0)}
  #overlay.show{display:block}
  #hamburger{display:block}
  #main{width:100%}
}
</style>
</head>

<script>
const EPISODES = [{"id": "EP653 _ 🕊️", "title": "EP653 | 🕊️", "date": "2026-04-15", "html": "<div class=\"header\">\n    <div class=\"meta\">股癌 Podcast 分析報告 · 2026-04-15</div>\n    <h1>EP653 | 🕊️</h1>\n  </div>\n\n  <div class='summary-box'><p>本集股癌主要討論台積電估值空間、聯發科在AI晶片（Google TPU相關V8/V9）的布局與成長潛力、Marvell獲Google晶片設計訂單的最新消息、被動元件漲價趨勢，以及個人美股持股配置（CPU類股、Marvell、光通訊、Cloudflare、Tesla）。整體看法偏多，認為AI仍是藍海市場，多頭行情應積極把握。</p></div>\n\n  <div class=\"quick-bar\"><span class=\"quick-tag bullish\">2330</span><span class=\"quick-tag bullish\">2454</span><span class=\"quick-tag bearish\">QCOM</span><span class=\"quick-tag bullish\">2327</span><span class=\"quick-tag bullish\">INTC</span><span class=\"quick-tag bullish\">ARM</span><span class=\"quick-tag bullish\">AMD</span><span class=\"quick-tag bullish\">LITE</span><span class=\"quick-tag bullish\">COHR</span><span class=\"quick-tag bullish\">NET</span><span class=\"quick-tag bullish\">TSLA</span><span class=\"quick-tag bullish\">6285</span><span class=\"quick-tag vague\">GOOGL</span><span class=\"quick-tag vague\">MRVL</span></div>\n\n  <div class='section-title'>🔍 詞彙解讀（股癌說的「光」「低軌」是指…）</div>\n        <div class=\"vague-card bullish\">\n          <div class=\"vague-header\">\n            <span class=\"vague-term\">「發哥」</span>\n            <span class=\"badge bullish\">📈 看多</span>\n          </div>\n          <p class=\"vague-interp\">聯發科（MediaTek）</p>\n          <blockquote>「像發哥他在往下破之後就立刻有資金再加入然後把它往上拉，那進來的資金我覺得他們就不是在買手機相關的股市，他們在買的東西都是跟發哥在AI裡面的投入就是有很大的一個關聯性」</blockquote>\n          <div class=\"cand-list\"><div class=\"cand-row\" data-cand-ticker=\"2454\" data-cand-name=\"聯發科\" data-cand-market=\"TW\"><code class=\"ticker\">2454</code><a href=\"https://tw.stock.yahoo.com/quote/2454\" target=\"_blank\" title=\"開啟 2454 K線圖\" class=\"chart-btn\"><svg viewBox=\"0 0 20 20\" fill=\"currentColor\" width=\"14\" height=\"14\"><rect x=\"2\" y=\"10\" width=\"3\" height=\"8\" rx=\"1\"/><rect x=\"8.5\" y=\"5\" width=\"3\" height=\"13\" rx=\"1\"/><rect x=\"15\" y=\"2\" width=\"3\" height=\"16\" rx=\"1\"/></svg></a> <span class=\"market-tag\">TW</span> <span class=\"cand-name\">聯發科</span><span class=\"cand-reason\"> — 股癌直接用「發哥」指稱，並詳細討論其與Google合作的V8/V9晶片、Zebrafish/Humafish代號，以及與博通、高通的比較</span><button class=\"wl-btn wl-btn-sm\" data-ticker=\"2454\" data-name=\"聯發科\" data-market=\"TW\" title=\"加入自選股\">⭐</button></div></div>\n        </div>\n\n        <div class=\"vague-card bullish\">\n          <div class=\"vague-header\">\n            <span class=\"vague-term\">「G社」</span>\n            <span class=\"badge bullish\">📈 看多</span>\n          </div>\n          <p class=\"vague-interp\">Google</p>\n          <blockquote>「那發哥目前跟G社的合作呢，我們看得到就是有兩顆啦，那一顆就是V8一顆就是V9」</blockquote>\n          <div class=\"cand-list\"><div class=\"cand-row\" data-cand-ticker=\"GOOGL\" data-cand-name=\"Alphabet (Google)\" data-cand-market=\"US\"><code class=\"ticker\">GOOGL</code><a href=\"https://finance.yahoo.com/quote/GOOGL\" target=\"_blank\" title=\"開啟 GOOGL K線圖\" class=\"chart-btn\"><svg viewBox=\"0 0 20 20\" fill=\"currentColor\" width=\"14\" height=\"14\"><rect x=\"2\" y=\"10\" width=\"3\" height=\"8\" rx=\"1\"/><rect x=\"8.5\" y=\"5\" width=\"3\" height=\"13\" rx=\"1\"/><rect x=\"15\" y=\"2\" width=\"3\" height=\"16\" rx=\"1\"/></svg></a> <span class=\"market-tag\">US</span> <span class=\"cand-name\">Alphabet (Google)</span><span class=\"cand-reason\"> — 股癌用G社指稱Google，後續詳細討論Google的TPU、CAPEX、與聯發科和Marvell的合作關係</span><button class=\"wl-btn wl-btn-sm\" data-ticker=\"GOOGL\" data-name=\"Alphabet (Google)\" data-market=\"US\" title=\"加入自選股\">⭐</button></div></div>\n        </div>\n\n        <div class=\"vague-card mention\">\n          <div class=\"vague-header\">\n            <span class=\"vague-term\">「BlockCon」</span>\n            <span class=\"badge mention\">💬 僅提及</span>\n          </div>\n          <p class=\"vague-interp\">Broadcom（博通）</p>\n          <blockquote>「觀察一下當MARVEL的消息出來之後，有沒有影響到BlockCon或者說MTK的一個價格，就會知道說那市場對這個東西是不是恐懼的」</blockquot hoo.com/quote/6285\" target=\"_blank\" title=\"開啟 6285 K線圖\" class=\"chart-btn\"><svg viewBox=\"0 0 20 20\" fill=\"currentColor\" width=\"14\" height=\"14\"><rect x=\"2\" y=\"10\" width=\"3\" height=\"8\" rx=\"1\"/><rect x=\"8.5\" y=\"5\" width=\"3\" height=\"13\" rx=\"1\"/><rect x=\"15\" y=\"2\" width=\"3\" height=\"16\" rx=\"1\"/></svg></a><span class=\"market-tag\">TW</span><button class=\"wl-btn\" data-ticker=\"6285\" data-name=\"啟碁\" data-market=\"TW\" title=\"加入自選股\">⭐</button></span>\n          </div>\n          <span class=\"badge bullish\">📈 看多</span>\n          <p class=\"reason\">SpaceX Starlink大客戶訂單金額約佔下市值的一半。除衛星外還有LCOS光交換器故事，但貢獻較慢。早在一月底就已分享此趨勢。</p>\n          <blockquote>「6285奇蹟確實是在他的大客戶SpaceX的Starlink這邊拿到了很多訂單，那數字確實是差不多落在你講的這個位置」</blockquote>\n        </div>\n\n        <div class=\"card mention\" data-ticker=\"3443\" data-name=\"創意\" data-market=\"TW\">\n          <div class=\"card-header\">\n            <span class=\"stock-name\">創意</span>\n            <span class=\"card-meta\"><code class=\"ticker\">3443</code><a href=\"https://tw.stock.yahoo.com/quote/3443\" target=\"_blank\" title=\"開啟 3443 K線圖\" class=\"chart-btn\"><svg viewBox=\"0 0 20 20\" fill=\"currentColor\" width=\"14\" height=\"14\"><rect x=\"2\" y=\"10\" width=\"3\" height=\"8\" rx=\"1\"/><rect x=\"8.5\" y=\"5\" width=\"3\" height=\"13\" rx=\"1\"/><rect x=\"15\" y=\"2\" width=\"3\" height=\"16\" rx=\"1\"/></svg></a><span class=\"market-tag\">TW</span><button class=\"wl-btn\" data-ticker=\"3443\" data-name=\"創意\" data-market=\"TW\" title=\"加入自選股\">⭐</button></span>\n          </div>\n          <span class=\"badge mention\">💬 僅提及</span>\n          <p class=\"reason\">提及創意也是做Google相關晶片，且有壓到（獲利），作為對比Marvell早期Maple未放量的案例。</p>\n          <blockquote>「可是像創意就有壓到，就創意一樣是去做Google的東西，這個我就有吃到它」</blockquote>\n        </div>\n\n  <div class='section-title'>類股 / 產業</div><div class=\"sector-chip bullish\"><span class=\"badge bullish\">📈 看多</span> <strong>被動元件</strong><span class=\"sector-reason\"> — 太陽誘電全系 cro-view\"> 伊朗事件影響已鈍化，只要油價不再創新高，就視為鈍化。市場已消化此風險。</span></div>\n        </div>\n\n  <div class=\"footer\">由 Claude 自動分析 · 僅供參考，非投資建議</div>"}, {"id": "EP652 _ 🐸", "title": "EP652 | 🐸", "date": "2026-04-11", "html": "<div class=\"header\">\n    <div class=\"meta\">股癌 Podcast 分析報告 · 2026-04-11</div>\n    <h1>EP652 | 🐸</h1>\n  </div>\n\n  <div class='summary-box'><p>本集股癌分享美股第二季終於回正，主要受惠於光通訊與CPU族群走強。重點討論CPU在Agentic AI時代的需求爆發（引用Amazon AWS Graviton供不應求），Anthropic推出Mythos但因算力不足無法公開發布，以及台股被動元件開始出現缺貨跡象（國巨法說會前瞻）。另外提到光通訊廠商因產能不足，開始委託LED打件廠等非本業廠商代工生產的新趨勢。</p></div>\n\n  <div class=\"quick-bar\"><span class=\"quick-tag bullish\">2327</span><span class=\"quick-tag bullish\">MRVL</span><span class=\"quick-tag bullish\">AMZN</span><span class=\"quick-tag bearish\">TSLA</span><span class=\"quick-tag vague\">AAOI</span><span class=\"quick-tag vague\">COHR</span><span class=\"quick-tag vague\">LITE</span><span class=\"quick-tag vague\">3380</span><span class=\"quick-tag vague\">4906</span><span class=\"quick-tag vague\">3596</span><span class=\"quick-tag vague\">3031</span><span class=\"quick-tag vague\">3591</span><span class=\"quick-tag vague\">3437</span><span class=\"quick-tag vague\">5244</span><span class=\"quick-tag vague\">2330</span><span class=\"quick-tag vague\">3711</span><span class=\"quick-tag vague\">村田製作所（Murata）</span><span class=\"quick-tag vague\">三星電機（Samsung Electro-Mechanics）</span><span class=\"quick-tag vague\">（無法確認具體標的）</span></div>\n\n  <div class='section-title'>🔍 詞彙解讀（股癌說的「光」「低軌」是指…）</div>\n        <div class=\"vague-card bullish\">\n          <div class=\"vague-header\">\n            <span class=\"vague-term\">「光通」</span>\n            <span class=\"badge bullish\">📈 看多</span>\n          </div>\n          <p class=\"vague-interp\">光通訊相關族群，涵蓋美系光通股及台股光通元件廠</p>\n          <blockquote>「就除了可能過去的三個月能夠講的就只有光通，因為光通是美股裡面少數表現很好...光通又再一次的創新高...現在有蠻多的光通廠然後不管是美系的，那其實有些是美系它是台股啦就是身體裡面是台股的」</blockquote>\n          <div class=\"cand-list\"><div class=\"cand-row\" data-cand-tic pan class=\"sector-reason\"> — 最近重新復活，與CPU、光通並列為美股新走出來的族群。</span></div>\n<div class=\"sector-chip bullish\"><span class=\"badge bullish\">📈 看多</span> <strong>先進封裝（後端封裝、M-Core、SPEEL等）</strong><span class=\"sector-reason\"> — GPU + CPU雙重需求下，先進製程相關的封裝與設備應該還可以再好一陣子。</span></div>\n\n  <div class='section-title'>總體經濟觀點</div>\n        <div class=\"macro-row\">\n          <div class=\"macro-topic\">美股整體走勢</div>\n          <div><span class=\"badge bullish\">📈 看多</span><span class=\"macro-view\"> 美股來到壓力位置，已站回季線上方視為回到多頭，但後續若有消息面干擾仍可能再往下打。如果下方都撐得住，這波修正可能已經結束。開始出現新族群（CPU、高速傳輸）輪動是健康多頭的訊號。</span></div>\n        </div>\n\n        <div class=\"macro-row\">\n          <div class=\"macro-topic\">台股走勢</div>\n          <div><span class=\"badge bullish\">📈 看多</span><span class=\"macro-view\"> 台股已拉到新高，各種類股輪動，是非常健康的多頭行情，沒有任何疑問。</span></div>\n        </div>\n\n        <div class=\"macro-row\">\n          <div class=\"macro-topic\">AI算力供需</div>\n          <div><span class=\"badge bullish\">📈 看多</span><span class=\"macro-view\"> GPU/Accelerator的ASIC需求已相對穩健，但CPU需求又冒出來成為新的瓶頸。算力供不應求的狀態短期無法快速解決，軍火業者（TSM、先進封裝等）還可以再好一陣子。</span></div>\n        </div>\n\n        <div class=\"macro-row\">\n          <div class=\"macro-topic\">AI模型廠商（Anthropic等）的行銷術語</div>\n          <div><span class=\"badge neutral\">➡️ 中立</span><span class=\"macro-view\"> Anthropic的Mythos未公開發布主因是算力不夠，而非其宣稱的「太危險」。AI模型廠商有過度尬吹的傾向，每次新產品發布都會打擊SaaS/軟體股，造成FUD情緒。</span></div>\n        </div>\n\n  <div class=\"footer\">由 Claude 自動分析 · 僅供參考，非投資建議</div>"}, {"id": "EP651 _ One for all", "title": "EP651 | One for all", "date": "2026-04-09", "html": "<div class=\"header\">\n    <div class=\"meta\">股癌 Podcast 分析報告 · 2026-04-09</div>\n    <h1>EP651 | One for all</h1>\n  </div>\n\n  <div class='summary-box'><p>本集股癌分享了參加林哲瑄退役儀式的感動經歷，並討論了市場近況：台股表現強勁、美股反彈力道大，關注美伊局勢與油價走向。投資面重點包括Intel與Tesla TeraFab合作的影響、中國手機廠砍單潮對消費性元件的衝擊、CPU在Agentic AI時代的需求增長、光通訊上游與設備股的佈局，以及被動元件與鋁電容的缺貨趨勢。</p></div>\n\n  <div class=\"quick-bar\"><span class=\"quick-tag bullish\">INTC</span  rx=\"1\"/><rect x=\"15\" y=\"2\" width=\"3\" height=\"16\" rx=\"1\"/></svg></a><span class=\"market-tag\">US</span><button class=\"wl-btn\" data-ticker=\"AMD\" data-name=\"AMD\" data-market=\"US\" title=\"加入自選股\">⭐</button></span>\n          </div>\n          <span class=\"badge bullish\">📈 看多</span>\n          <p class=\"reason\">CPU在Agentic AI時代重要性大增，AMD執行長Lisa Su確認agent工作流大量使用CPU任務，AMD持續吃掉Intel市佔，成長性更好。已開始佈局。</p>\n          <blockquote>「像是R像是Intel像是AMD他們算是在美股市場裡面是相對比較硬的東西...如果今天要看CPU的話應該還是會先回到去看AMD跟Intel」</blockquote>\n        </div>\n\n        <div class=\"card bullish\" data-ticker=\"INTC\" data-name=\"Intel\" data-market=\"US\">\n          <div class=\"card-header\">\n            <span class=\"stock-name\">Intel</span>\n            <span class=\"card-meta\"><code class=\"ticker\">INTC</code><a href=\"https://finance.yahoo.com/quote/INTC\" target=\"_blank\" title=\"開啟 INTC K線圖\" class=\"chart-btn\"><svg viewBox=\"0 0 20 20\" fill=\"currentColor\" width=\"14\" height=\"14\"><rect x=\"2\" y=\"10\" width=\"3\" height=\"8\" rx=\"1\"/><rect x=\"8.5\" y=\"5\" width=\"3\" height=\"13\" rx=\"1\"/><rect x=\"15\" y=\"2\" width=\"3\" height=\"16\" rx=\"1\"/></svg></a><span class=\"market-tag\">US</span><button class=\"wl-btn\" data-ticker=\"INTC\" data-name=\"Intel\" data-market=\"US\" title=\"加入自選股\">⭐</button></span>\n          </div>\n          <span class=\"badge bullish\">📈 看多</span>\n          <p class=\"reason\">Intel CFO承認錯估CPU需求，Xeon 6產能absolutely constraint（缺貨），且在NVIDIA DGX/NVL8的Host CPU上有一席之地，可望與AMD一起受惠。</p>\n          <blockquote>「在Intel的CFO這邊有看到他講說Misjudge the pace of demand...Xeon 6呢目前的產能是absolutely constraint就是掉缺的」</blockquote>\n        </div>\n\n        <div class=\"card bullish\" data-ticker=\"ARM\" data-name=\"ARM Holdings\" data-market=\"US\">\n          <div class=\"card-header\">\n            <span class=\"stock-name\">ARM Holdings</span>\n            <span class=\"card-meta\"><code class=\"ticker\">ARM</code><a href=\"https://finance.yahoo.com/quote/ARM\" target=\"_blank\" title=\"開啟 ARM K線圖\" class=\"chart-btn\"><svg viewBox=\"0 0 20 20\" fill=\"currentColor\" width=\"14\" height=\"14\"><rect x=\"2\" y=\"10\" width=\"3\" height=\"8\" rx=\"1\"/><rect x=\"8.5\" y=\"5\" width=\"3\" height=\"13\" rx=\"1\"/><rect x=\"15\" y=\"2\" width=\"3\" height=\"16\" rx=\"1\"/></svg></a><span class=\"market-tag\">US</span><button class=\"wl-btn\" data-ticker=\"ARM\" data-name=\"ARM Holdings\" data-market=\"US\" title=\"加入自選股\">⭐</button></span>\n          </div>\n          <span class=\"badge bullish\">📈 看多</span>\n          <p class=\"reason\">ARM伺服器市佔從2018年低於5%成長到2025年20-25%，在HyperScaler中佔比達50%，AWS Graviton、Google Axion、Azure Cobalt等都使用ARM架構CPU。</p>\n          <blockquote>「ARM的伺服器市佔率從大概2018年的時候是低於5%到現在2025年是已經跑到20%到25%...特別在一些ASIC方面也有很多的應用」</blockquote>\n        </div>\n\n        <div class=\"card bullish\" data-ticker=\"NVDA\" data-name=\"NVIDIA\" data-market=\"US\">\n          <div class=\"card-header\">\n            <span class=\"stock-name\">NVIDIA</span>\n            <span class=\"card-meta\"><code class=\"ticker\">NVDA</code><a href=\"https://finance.yahoo.com/quote/NVDA\" target=\"_blank\" title=\"開啟 NVDA K線圖\" class=\"chart-btn\"><svg viewBox=\"0 0 20 20\" fill=\"currentColor\" width=\"14\" height=\"14\"><rect x=\"2\" y=\"10\" width=\"3\" height=\"8\" rx=\"1\"/><rect x=\"8.5\" y=\"5\" width=\"3\" height=\"13\" rx=\"1\"/><rect x=\"15\" y=\"2\" width=\"3\" height=\"16\" rx=\"1\"/></svg></a><span class=\"market-tag\">US</span><button class=\"wl-btn\" data-ticker=\"NVDA\" data-name=\"NVIDIA\" data-market=\"US\" title=\"加入自選股\">⭐</button></span>\n          </div>\n          <span class=\"badge bullish\">📈 看多</span>\n          <p class=\"reason\">Jensen提到未來會有更多獨立CPU部署，NVIDIA自身有Vera Ruby平台（88核ARM架構+自研Olympus核心），也算CPU相關類股。但因純度不高，不是CPU題材首選。BOM表已流出，帶動被動元件族群。</p>\n          <blockquote>「在NVIDIA這邊Jensen也有提到說未來會有更多獨立的CPU的部署...它本身是有Vera的CPU那Vera的CPU看起來也是有獲得客戶的一個採用」</blockquote>\n        </div>\n\n        <div class=\"card bullish\" data-ticker=\"3533\" data-name=\"嘉澤\" data-market=\"TW\">\n          <div class=\"card-header\">\n            <span class=\"stock-name\">嘉澤</span>\n            <span class=\"card-meta\"><code class=\"ticker\">3533</code><a href=\"https://tw.stock.yahoo.com/quote/3533\" target=\"_blank\" title=\"開啟 3533 K線圖\" class=\"chart-btn\"><svg viewBox=\"0 0 20 20\" fill=\"currentColor\" width=\"14\" height=\"14\"><rect x=\"2\" y=\"10\" width=\"3\" height=\"8\" rx=\"1\"/><rect x=\"8.5\" y=\"5\" width=\"3\" height=\"13\" rx=\"1\"/><rect x=\"15\" y=\"2\" width=\"3\" height=\"16\" rx=\"1\"/></svg></a><span class=\"market-tag\">TW</span><button class=\"wl-btn\" data-ticker=\"3533\" data-name=\"嘉澤\" data-market=\"TW\" title=\"加入自選股\">⭐</button></span>\n          </div>\n          <span class=\"badge bullish\">📈 看多</span>\n          <p class=\"reason\">與CPU Socket高度相關，在台股中屬於相對強勢的標的，作為CPU趨勢在台股的觀察指標。</p>\n          <blockquote>「你看一下3533佳澤他就是跟CPU Socket是高度相關的一個標的那這些東西都算是相對強勢」</blockquote>\n        </div>\n\n        <div class=\"card mention\" data-ticker=\"6257\" data-name=\"矽格\" data-market=\"TW\">\n          <div class=\"card-header\">\n            <span class=\"stock-name\">矽格</span>\n            <span class=\"card-meta\"><code class=\"ticker\">6257</code><a href=\"https://tw.stock.yahoo.com/quote/6257\" target=\"_blank\" title=\"開啟 6257 K線圖\" class=\"chart-btn\"><svg viewBox=\"0 0 20 20\" fill=\"currentColor\" width=\"14\" height=\"14\"><rect x=\"2\" y=\"10\" width=\"3\" height=\"8\" rx=\"1\"/><rect x=\"8.5\" y=\"5\" width=\"3\" height=\"13\" rx=\"1\"/><rect x=\"15\" y=\"2\" width=\"3\" height=\"16\" rx=\"1\"/></svg></a><span class=\"market-tag\">TW</span><button class=\"wl-btn\" data-ticker=\"6257\" data-name=\"矽格\" data-market=\"TW\" title=\"加入自選股\">⭐</button></span>\n          </div>\n          <span class=\"badge mention\">💬 僅提及</span>\n          <p class=\"reason\">聽眾留言提到的標的，股癌提到最近蠻多人在看，與光通訊或Marvell後段相關，像旗幟一樣被綁在一起關注。</p>\n          <blockquote>「6257其實最近蠻多人在看的就是他是光通或是說像MARVEL的後段那這個最近確實像那個棋棒一樣被綁在一起大家一起來看」</blockquote>\n        </div>\n\n        <div class=\"card neutral\" data-ticker=\"8069\" data-name=\"元太\" data-market=\"TW\">\n          <div class=\"card-header\">\n            <span class=\"stock-name\">元太</span>\n            <span class=\"card-meta\"><code class=\"ticker\">8069</code><a href=\"https://tw.stock.yahoo.com/quote/8069\" target=\"_blank\" title=\"開啟 8069 K線圖\" class=\"chart-btn\"><svg viewBox=\"0 0 20 20\" fill=\"currentColor\" width=\"14\" height=\"14\"><rect x=\"2\" y=\"10\" width=\"3\" height=\"8\" rx=\"1\"/><rect x=\"8.5\" y=\"5\" width=\"3\" height=\"13\" rx=\"1\"/><rect x=\"15\" y=\"2\" width=\"3\" height=\"16\" rx=\"1\"/></svg></a><span class=\"market-tag\">TW</span><button class=\"wl-btn\" data-ticker=\"8069\" data-name=\"元太\" data-market=\"TW\" title=\"加入自選股\">⭐</button></span>\n          </div>\n          <span class=\"badge neutral\">➡️ 中立</span>\n          <p class=\"reason\">聽眾持有並大幅虧損的標的，股癌表示目前市場上沒有看到電子紙相關的催化或題材，認為此時持有比較奇怪。</p>\n          <blockquote>「你問我覺得很怪因為我怎麼知道你買的東西是什麼...如果說好你跟我一樣是題材型的買進者的話那你現在買這個超怪因為我並沒有在市場上看到任何與這相關的催化或是題材」</blockquote>\n        </div>\n\n  <div class='section-title'>類股 / 產業</div><div class=\"sector-chip bullish\"><span class=\"badge bullish\">📈 看多</span> <strong>CPU相關族群</strong><span class=\"sector-reason\"> — Agentic AI時代CPU從配角變瓶頸，AMD/Intel/NVIDIA三家CEO/CFO均確認趨勢。CPU在agent工作流佔延遲50-90%，Intel Xeon 6缺貨，可能出現類似HBM的供需緊張。</span></div>\n<div class=\"sector-chip bullish\"><span class=\"badge bullish\">📈 看多</span> <strong>光通訊</strong><span class=\"sector-reason\"> — 股癌提到在美股中光通跟CPU目前走得相對比較好，帶有故事性。形容光通是sky is the limit，大家都可以做無限想像。</span></div>\n<div class=\"sector-chip bullish\"><span class=\"badge bullish\">📈 看多</span> <strong>鋁相關供應鏈</strong><span class=\"sector-reason\"> — 中東兩家鋁廠被炸，鋁價突破波段新高，中東供應約十幾%全球產量。鋁在市場上非常被需要，可能傳導至鋁箔、鋁電被動元件漲價。作為戰爭風險的hedge佈局。</span></div>\n<div class=\"sector-chip bullish\"><span class=\"badge bullish\">📈 看多</span> <strong>被動元件</strong><span class=\"sector-reason\"> — NVIDIA最新BOM表流出，市場注意到用料量大，開始往被動元件方向佈局。加上鋁電/鉭電缺貨，短期有漲價題材。但長期（三年）可能被MLCC取代，本益比空間有限。</span></div>\n<div class=\"sector-chip neutral\"><span class=\"badge neutral\">➡️ 中立</span> <strong>塑化股</strong><span class=\"sector-reason\"> — 身邊朋友在佈局，邏輯是中東戰爭若切斷伊朗對中國的廉價石油供應，台灣塑化股可能受惠。但股癌自認塑化離自己太遠，沒有親自佈局，屬事件財/時機財。</span></div>\n<div class=\"sector-chip bearish\"><span class=\"badge bearish\">📉 看空</span> <strong>電子紙</strong><span class=\"sector-reason\"> — 目前市場上沒有看到電子紙相關的催化或題材，認為現在沒有買進的理由。</span></div>\n\n  <div class='section-title'>總體經濟觀點</div>\n        <div class=\"macro-row\">\n          <div class=\"macro-topic\">中東戰爭與油價</div>\n          <div><span class=\"badge neutral\">➡️ 中立</span><span class=\"macro-view\"> 美國攻擊伊朗有其戰略合理性，類似預防性行動。短期油價維持高檔，若持續突破新高可能導致訂單終止與較大回檔，但目前仍視為大格局多頭回檔。若油價持續破高則會調整策略。</span></div>\n        </div>\n\n        <div class=\"macro-row\">\n          <div class=\"macro-topic\">AI產業趨勢：從GPU到CPU</div>\n          <div><span class=\"badge bullish\">📈 看多</span><span class=\"macro-view\"> Agentic AI時代CPU重要性大幅提升，CPU在推論工作流中佔總延遲50-90%，已從配角變為瓶頸。AMD、Intel、NVIDIA三家CEO/CFO都確認此趨勢。CPU可能出現類似過去HBM/SSD的意外缺貨漲價。</span></div>\n        </div>\n\n        <div class=\"macro-row\">\n          <div class=\"macro-topic\">整體市場看法</div>\n          <div><span class=\"badge neutral\">➡️ 中立</span><span class=\"macro-view\"> 市場波動大，美股比台股更難操作。目前仍視為大格局多頭的回檔，但若持續破底加上油價破高，會修改策略。</span></div>\n        </div>\n\n  <div class=\"footer\">由 Claude 自動分析 · 僅供參考，非投資建議</div>"}, {"id": "EP649 _ 💌", "title": "EP649 | 💌", "date": "2026-04-01", "html": "<div class=\"header\">\n    <div class=\"meta\">股癌 Podcast 分析報告 · 2026-04-01</div>\n    <h1>EP649 | 💌</h1>\n  </div>\n\n  <div class='summary-box'><p>本集股癌分享近期操作心態，認為台股強於美股，台股反彈後可能進入多頭迴盪格局，但美股僅視為死貓跳。重點討論NVIDIA投資Marvell的戰略意義，認為NVIDIA主要目標是搶Broadcom的ASIC周邊市場，並分析NVLink Fusion生態系對各廠商的影響。同時提醒油價與VIX仍在高檔，不宜使用槓桿，應控制部位大小。</p></div>\n\n  <div class=\"quick-bar\"><span class=\"quick-tag bullish\">MRVL</span><span class=\"quick-tag bullish\">ALAB</span><span class=\"quick-tag vague\">COHR</span><span class=\"quick-tag vague\">LITE</span></div>\n\n  <div class='section-title'>🔍 詞彙解讀（股癌說的「光」「低軌」是指…）</div>\n        <div class=\"vague-card neutral\">\n          <div class=\"vague-header\">\n            <span class=\"vague-term\">「BlockCon」</span>\n            <span class=\"badge neutral\">➡️ 中立</span>\n          </div>\n          <p class=\"vague-interp\">指Broadcom（博通），股癌習慣用的諧音/暱稱</p>\n          <blockquote>「我會認為說他的劍指是BlockCon 最主要是要去打BlockCon 那去拉這些快樂好朋友 像是可能Marvel 或是L-chip或是MTK...就即便可能BlockCon他假設在NVIDIA沒有去做這麼多有的沒有的嘗試之前他可以拿到的餅是一個拳頭這麼大個」</blockquote>\n          <div class=\"cand-list\"><div class=\"cand-row\" data-cand-ticker=\"AVGO\" data-cand-name=\"Broadcom\" data-cand-market=\"US\"><code class=\"ticker\">AVGO</code><a href=\"https://finance.yahoo.com/quote/AVGO\" target=\"_blank\" title=\"開啟 AVGO K線圖\" class=\"chart-btn\"><svg viewBox=\"0 0 20 20\" fill=\"currentColor\" width=\"14\" height=\"14\"><rect x=\"2\" y=\"10\" width=\"3\" height=\"8\" rx=\"1\"/><rect x=\"8.5\" y=\"5\" width=\"3\" height=\"13\" rx=\"1\"/><rect x=\"15\" y=\"2\" width=\"3\" height=\"16\" rx=\"1\"/></svg></a> <span class=\"market-tag\">US</span> <span class=\"cand-name\">Broadcom</span><span class=\"cand-reason\"> — 上下文明確討論NVIDIA vs Broadcom在ASIC市場的競爭，BlockCon是Broadcom的諧音，且提到博通也有對應的解決方案與NVIDIA競爭</span><button class=\"wl-btn wl-btn-sm\" data-ticker=\"AVGO\" data-name=\"Broadcom\" data-market=\"US\" title=\"加入自選股\">⭐</button></div></div>\n        </div>\n\n        <div class=\"vague-card mention\">\n          <div class=\"vague-header\">\n            <span class=\"vague-term\">「L-chip」</span>\n            <span class=\"badge mention\">💬 僅提及</span>\n          </div>\n          <p class=\"vague-interp\">指聯發科旗下或Alchip（世芯-KY）等ASIC設計服務公司，在NVLink Fusion聯盟中被NVIDIA拉攏的夥伴</p>\n          <blockquote>「那去拉這些快樂好朋友 像是可能Marvel 或是L-chip或是MTK 各種什麼NVIDIA Fusion的活動 把你們做在一起」</blockquote>\n          <div class=\"cand-list\"><div class=\"cand-row\" data-cand-ticker=\"3661\" data-cand-name=\"世芯-KY\" data- 一塊 但最後一面就是由NVIDIA先持得點」</blockquote>\n        </div>\n\n  <div class='section-title'>類股 / 產業</div><div class=\"sector-chip bullish\"><span class=\"badge bullish\">📈 看多</span> <strong>光通訊</strong><span class=\"sector-reason\"> — 股癌提到市場現在就是要光通，買光就很舒服，估值可以無限上修。自己也有配置光通標的，前一波沙盤時撈了光通，出現50%、60%甚至100%的漲幅。NVIDIA也投資了Coherent和Lumentum兩個光通全包。</span></div>\n<div class=\"sector-chip bullish\"><span class=\"badge bullish\">📈 看多</span> <strong>ASIC</strong><span class=\"sector-reason\"> — Hyperscaler持續推進自己的ASIC，NVIDIA透過NVLink Fusion插旗ASIC周邊市場，雖不提供ASIC本身但所有外圍連結都有。整體ASIC市場是藍海，各家都能吃飽。</span></div>\n<div class=\"sector-chip neutral\"><span class=\"badge neutral\">➡️ 中立</span> <strong>玻璃基板</strong><span class=\"sector-reason\"> — 上集提到的玻璃基板題材，經查證後確認需一年半到兩年才會放量，設備提早拉貨也要半年後才有營收貢獻，偏向未來題材。但不排除像CPO一樣提早被市場拉上去。</span></div>\n<div class=\"sector-chip neutral\"><span class=\"badge neutral\">➡️ 中立</span> <strong>高速傳輸（Retimer等）</strong><span class=\"sector-reason\"> — 股癌認為傳統傳輸相關標的被市場過度打壓，Astera Labs和Marvell被人人喊打，但實際上不同層級可以共存，等市場環境改變後論述也會跟著改變。</span></div>\n\n  <div class='section-title'>總體經濟觀點</div>\n        <div class=\"macro-row\">\n          <div class=\"macro-topic\">中東局勢與油價</div>\n          <div><span class=\"badge bearish\">📉 看空</span><span class=\"macro-view\"> 雖然伊朗釋出和談訊號，但美軍仍在當地、遠月油價也未下跌，市場並未完全相信會和談。油價維持高檔就要小心，不宜上槓桿。油價只要不再突破新高就沒問題，若突破新高則維持保守。</span></div>\n        </div>\n\n        <div class=\"macro-row\">\n          <div class=\"macro-topic\">台股 vs 美股強弱</div>\n          <div><span class=\"badge neutral\">➡️ 中立</span><span class=\"macro-view\"> 台股回踩重要均線後強勢反彈，若持續創高就是多頭迴盪格局；美股則只是死貓跳加人道走廊，整個盤已走空，反彈後若均線下壓再跌，可能還有一波大的。</span></div>\n        </div>\n\n        <div class=\"macro-row\">\n          <div class=\"macro-topic\">波動率（VIX）</div>\n          <div><span class=\"badge bearish\">📉 看空</span><span class=\"macro-view\"> VIX仍在高位震盪，波動率未死絕前要維持高警戒狀態。VIX跳上去時做越多決定越受傷，等波動率死絕再降低警戒。</span></div>\n        </div>\n\n        <div class=\"macro-row\">\n          <div class=\"macro-topic\">清明連假操作策略</div>\n  data-name=\"NVIDIA\" data-market=\"US\" title=\"加入自選股\">⭐</button></span>\n          </div>\n          <span class=\"badge neutral\">➡️ 中立</span>\n          <p class=\"reason\">NVIDIA也在破底持續往下，不會在前面橫很久然後破底的地方做加碼。提到NVIDIA的Quantum、Spectrum出貨數字超級亂。費曼架構尚未採用玻璃基板。</p>\n          <blockquote>「像是什麼NVIDIA都已經是也在破底都在持續的往下那我自己是比較不會想要在這種就它前面橫很久然後現在開始破底的地方去做加碼」</blockquote>\n        </div>\n\n        <div class=\"card neutral\" data-ticker=\"AVGO\" data-name=\"Broadcom\" data-market=\"US\">\n          <div class=\"card-header\">\n            <span class=\"stock-name\">Broadcom</span>\n            <span class=\"card-meta\"><code class=\"ticker\">AVGO</code><a href=\"https://finance.yahoo.com/quote/AVGO\" target=\"_blank\" title=\"開啟 AVGO K線圖\" class=\"chart-btn\"><svg viewBox=\"0 0 20 20\" fill=\"currentColor\" width=\"14\" height=\"14\"><rect x=\"2\" y=\"10\" width=\"3\" height=\"8\" rx=\"1\"/><rect x=\"8.5\" y=\"5\" width=\"3\" height=\"13\" rx=\"1\"/><rect x=\"15\" y=\"2\" width=\"3\" height=\"16\" rx=\"1\"/></svg></a><span class=\"market-tag\">US</span><button class=\"wl-btn\" data-ticker=\"AVGO\" data-name=\"Broadcom\" data-market=\"US\" title=\"加入自選股\">⭐</button></span>\n          </div>\n          <span class=\"badge neutral\">➡️ 中立</span>\n          <p class=\"reason\">也在破底持續往下。但在玻璃基板方面走得較快，與日本凸版在新加坡合資產線，Tomahawk第八代預計採用玻璃基板。</p>\n          <blockquote>「像是什麼AlphaGo或是就是BlockCon AVGO那或者像是什麼NVIDIA都已經是也在破底都在持續的往下」</blockquote>\n        </div>\n\n        <div class=\"card mention\" data-ticker=\"INTC\" data-name=\"Intel\" data-market=\"US\">\n          <div class=\"card-header\">\n            <span class=\"stock-name\">Intel</span>\n            <span class=\"card-meta\"><code class=\"ticker\">INTC</code><a href=\"https://finance.yahoo.com/quote/INTC\" target=\"_blank\" title=\"開啟 INTC K線圖\" class=\"chart-btn\"><svg viewBox=\"0 0 20 20\" fill=\"currentColor\" width=\"14\" height=\"14\"><rect x=\"2\" y=\"10\" width=\"3\" height=\"8\" rx=\"1\"/><rect x=\"8.5\" y=\"5\" width=\"3\" height=\"13\" rx=\"1\"/><rect x=\"15\" y=\"2\" width=\"3\" height=\"16\" rx=\"1\"/></svg></a><span class=\"market-tag\">US</span><button class=\"wl-btn\" data-ticker=\"INTC\" data-name=\"Intel\" data-market=\"US\" title=\"加入自選股\">⭐</button></span>\n          </div>\n          <span class=\"badge mention\">💬 僅提及</span>\n          <p class=\"reason\">在玻璃基板領域走得最前面，數年前就找台系夥伴開發。EMIB封裝方式被Google TPU V9採用。在日本展會展出Glass Core Substrate搭配EMIB的方案。</p>\n          <blockquote>「在玻璃方面走的比較前面的應該就是英特爾就英特爾早在數年前就已經有去找一些台系的夥伴一起去開發」</blockquote>\n        </div>\n\n        <div class=\"card bearish\" data-ticker=\"TSLA\" data-name=\"特斯拉\" data-market=\"US\">\n          <div class=\"card-header\">\n            <span class=\"stock-name\">特斯拉</span>\n            <span class=\"card-meta\"><code class=\"ticker\">TSLA</code><a href=\"https://finance.yahoo.com/quote/TSLA\" target=\"_blank\" title=\"開啟 TSLA K線圖\" class=\"chart-btn\"><svg viewBox=\"0 0 20 20\" fill=\"currentColor\" width=\"14\" height=\"14\"><rect x=\"2\" y=\"10\" width=\"3\" height=\"8\" rx=\"1\"/><rect x=\"8.5\" y=\"5\" width=\"3\" height=\"13\" rx=\"1\"/><rect x=\"15\" y=\"2\" width=\"3\" height=\"16\" rx=\"1\"/></svg></a><span class=\"market-tag\">US</span><button class=\"wl-btn\" data-ticker=\"TSLA\" data-name=\"特斯拉\" data-market=\"US\" title=\"加入自選股\">⭐</button></span>\n          </div>\n          <span class=\"badge bearish\">📉 看空</span>\n          <p class=\"reason\">股價像一坨大便。TERRAFAB在財務上是累贅，類似META當年搞元宇宙的transition階段，看不太到後面要搞什麼。</p>\n          <blockquote>「特斯拉的股價最近真的他媽像一坨大便...他要去搞那個TERRAFAB的一些看法最主要是我覺得在財務上面一定是一個累贅」</blockquote>\n        </div>\n\n        <div class=\"card mention\" data-ticker=\"GOOGL\" data-name=\"Google（Alphabet）\" data-market=\"US\">\n          <div class=\"card-header\">\n            <span class=\"stock-name\">Google（Alphabet）</span>\n            <span class=\"card-meta\"><code class=\"ticker\">GOOGL</code><a href=\"https://finance.yahoo.com/quote/GOOGL\" target=\"_blank\" title=\"開啟 GOOGL K線圖\" class=\"chart-btn\"><svg viewBox=\"0 0 20 20\" fill=\"currentColor\" width=\"14\" height=\"14\"><rect x=\"2\" y=\"10\" width=\"3\" height=\"8\" rx=\"1\"/><rect x=\"8.5\" y=\"5\" width=\"3\" height=\"13\" rx=\"1\"/><rect x=\"15\" y=\"2\" width=\"3\" height=\"16\" rx=\"1\"/></svg></a><span class=\"market-tag\">US</span><button class=\"wl-btn\" data-ticker=\"GOOGL\" data-name=\"Google（Alphabet）\" data-market=\"US\" title=\"加入自選股\">⭐</button></span>\n          </div>\n          <span class=\"badge mention\">💬 僅提及</span>\n          <p class=\"reason\">TPU V9（HomoFish）因晶片過大無法在CoWoS上執行，轉用Intel EMIB封裝。另外Google的KV Cache壓縮技術被市場拿來殺記憶體股，股癌認為是市場耍白癡。</p>\n          <blockquote>「Google的HomoFish因為那整個晶片是變得很大一顆...所以他就是沒有辦法在Coast上面去做執行所以怎麼樣呢他們就轉去EMIB」</blockquote>\n        </div>\n\n        <div class=\"card mention\" data-ticker=\"PLTR\" data-name=\"Palantir\" data-market=\"US\">\n          <div class=\"card-header\">\n            <span class=\"stock-name\">Palantir</span>\n            <span class=\"card-meta\"><code class=\"ticker\">PLTR</code><a href=\"https://finance.yahoo.com/quote/PLTR\" target=\"_blank\" title=\"開啟 PLTR K線圖\" class=\"chart-btn\"><svg viewBox=\"0 0 20 20\" fill=\"currentColor\" width=\"14\" height=\"14\"><rect x=\"2\" y=\"10\" width=\"3\" height=\"8\" rx=\"1\"/><rect x=\"8.5\" y=\"5\" width=\"3\" height=\"13\" rx=\"1\"/><rect x=\"15\" y=\"2\" width=\"3\" height=\"16\" rx=\"1\"/></svg></a><span class=\"market-tag\">US</span><button class=\"wl-btn\" data-ticker=\"PLTR\" data-name=\"Palantir\" data-market=\"US\" title=\"加入自選股\">⭐</button></span>\n          </div>\n          <span class=\"badge mention\">💬 僅提及</span>\n          <p class=\"reason\">作為被錯殺後快速站回的軟體股例子被提及。</p>\n          <blockquote>「以這個軟體股來講像是Parenteer Cloudflare其實都很快就站回去」</blockquote>\n        </div>\n\n        <div class=\"card mention\" data-ticker=\"NET\" data-name=\"Cloudflare\" data-market=\"US\">\n          <div class=\"card-header\">\n            <span class=\"stock-name\">Cloudflare</span>\n            <span class=\"card-meta\"><code class=\"ticker\">NET</code><a href=\"https://finance.yahoo.com/quote/NET\" target=\"_blank\" title=\"開啟 NET K線圖\" class=\"chart-btn\"><svg viewBox=\"0 0 20 20\" fill=\"currentColor\" width=\"14\" height=\"14\"><rect x=\"2\" y=\"10\" width=\"3\" height=\"8\" rx=\"1\"/><rect x=\"8.5\" y=\"5\" width=\"3\" height=\"13\" rx=\"1\"/><rect x=\"15\" y=\"2\" width=\"3\" height=\"16\" rx=\"1\"/></svg></a><span class=\"market-tag\">US</span><button class=\"wl-btn\" data-ticker=\"NET\" data-name=\"Cloudflare\" data-market=\"US\" title=\"加入自選股\">⭐</button></span>\n          </div>\n          <span class=\"badge mention\">💬 僅提及</span>\n          <p class=\"reason\">被提及兩次：一次是比喻蘋果在AI時代像便宜版Cloudflare收過路費；另一次是作為軟體股被錯殺後快速站回的例子。</p>\n          <blockquote>「它有點類似像是Cloudflare這樣的一個角色只是非常便宜的Cloudflare它可以去做收取過路費的行為」</blockquote>\n        </div>\n\n        <div class=\"card mention\" data-ticker=\"CRWD\" data-name=\"CrowdStrike\" data-market=\"US\">\n          <div class=\"card-header\">\n            <span class=\"stock-name\">CrowdStrike</span>\n            <span class=\"card-meta\"><code class=\"ticker\">CRWD</code><a href=\"https://finance.yahoo.com/quote/CRWD\" target=\"_blank\" title=\"開啟 CRWD K線圖\" class=\"chart-btn\"><svg viewBox=\"0 0 20 20\" fill=\"currentColor\" width=\"14\" height=\"14\"><rect x=\"2\" y=\"10\" width=\"3\" height=\"8\" rx=\"1\"/><rect x=\"8.5\" y=\"5\" width=\"3\" height=\"13\" rx=\"1\"/><rect x=\"15\" y=\"2\" width=\"3\" height=\"16\" rx=\"1\"/></svg></a><span class=\"market-tag\">US</span><button class=\"wl-btn\" data-ticker=\"CRWD\" data-name=\"CrowdStrike\" data-market=\"US\" title=\"加入自選股\">⭐</button></span>\n          </div>\n          <span class=\"badge mention\">💬 僅提及</span>\n          <p class=\"reason\">軟體股錯殺後有反彈，但又被Anthropic事件再次打下去。</p>\n          <blockquote>「CrossStrike其實也是有反彈只是當然最近又被Enthrobio殺下去就再一次市場就是反正就出一個東西然後就把大家都打下去」</blockquote>\n        </div>\n\n        <div class=\"card mention\" data-ticker=\"META\" data-name=\"Meta\" data-market=\"US\">\n          <div class=\"card-header\">\n            <span class=\"stock-name\">Meta</span>\n            <span class=\"card-meta\"><code class=\"ticker\">META</code><a href=\"https://finance.yahoo.com/quote/META\" target=\"_blank\" title=\"開啟 META K線圖\" class=\"chart-btn\"><svg viewBox=\"0 0 20 20\" fill=\"currentColor\" width=\"14\" height=\"14\"><rect x=\"2\" y=\"10\" width=\"3\" height=\"8\" rx=\"1\"/><rect x=\"8.5\" y=\"5\" width=\"3\" height=\"13\" rx=\"1\"/><rect x=\"15\" y=\"2\" width=\"3\" height=\"16\" rx=\"1\"/></svg></a><span class=\"market-tag\">US</span><button class=\"wl-btn\" data-ticker=\"META\" data-name=\"Meta\" data-market=\"US\" title=\"加入自選股\">⭐</button></span>\n          </div>\n          <span class=\"badge mention\">💬 僅提及</span>\n          <p class=\"reason\">用META從元宇宙transition到AI的案例來類比特斯拉TERRAFAB可能的走勢。</p>\n          <blockquote>「我感覺他有點像之前META的那個Transition階段就是他要去搞那種元宇宙然後那時候不是股價底要爛掉嗎」</blockquote>\n        </div>\n\n        <div class=\"card mention\" data-ticker=\"2330\" data-name=\"台積電\" data-market=\"TW\">\n          <div class=\"card-header\">\n            <span class=\"stock-name\">台積電</span>\n            <span class=\"card-meta\"><code class=\"ticker\">2330</code><a href=\"https://tw.stock.yahoo.com/quote/2330\" target=\"_blank\" title=\"開啟 2330 K線圖\" class=\"chart-btn\"><svg viewBox=\"0 0 20 20\" fill=\"currentColor\" width=\"14\" height=\"14\"><rect x=\"2\" y=\"10\" width=\"3\" height=\"8\" rx=\"1\"/><rect x=\"8.5\" y=\"5\" width=\"3\" height=\"13\" rx=\"1\"/><rect x=\"15\" y=\"2\" width=\"3\" height=\"16\" rx=\"1\"/></svg></a><span class=\"market-tag\">TW</span><button class=\"wl-btn\" data-ticker=\"2330\" data-name=\"台積電\" data-market=\"TW\" title=\"加入自選股\">⭐</button></span>\n          </div>\n          <span class=\"badge mention\">💬 僅提及</span>\n          <p class=\"reason\">在玻璃基板方面目前只用Glass Carrier，CoPoS用Panel做。尚未使用Glass Interposer。若台積電大量採用玻璃，代表題材已成真。</p>\n          <blockquote>「在TSM的話他們有一個Corpus那這Corpus是使用Panel那目前我們應該是還沒有看到它會使用Glass Interposer」</blockquote>\n        </div>\n\n  <div class='section-title'>類股 / 產業</div><div class=\"sector-chip bullish\"><span class=\"badge bullish\">📈 看多</span> <strong>光通訊</strong><span class=\"sector-reason\"> — 光通走得非常好，手上有加碼光設備。但故意等回檔再聊，避免追高。正在研究CW Laser、Optical Engines數量及NVIDIA Quantum/Spectrum出貨數字。</span></div>\n<div class=\"sector-chip neutral\"><span class=\"badge neutral\">➡️ 中立</span> <strong>玻璃基板（Glass Core Substrate / TGV）</strong><span class=\"sector-reason\"> — 長期看好但時間還太早。量產要等2027中到2028年，GCS/TGV放量時程明確。目前Intel和Broadcom走較快，台積電尚未大量採用。市場可能提早反映但要注意時間差。</span></div>\n<div class=\"sector-chip bullish\"><span class=\"badge bullish\">📈 看多</span> <strong>記憶體</strong><span class=\"sector-reason\"> — 反駁Google KV Cache壓縮技術殺記憶體的論述，認為是市場耍白癡。壓縮技術不是新東西，且符合Jevons Paradox（效率提升反而增加用量）。但股價已漲好幾倍，不幫股價做背書。</span></div>\n<div class=\"sector-chip neutral\"><span class=\"badge neutral\">➡️ 中立</span> <strong>軟體股</strong><span class=\"sector-reason\"> — 過去被AI取代論打壓，但Palantir、Cloudflare等快速站回。市場常犯非A即B的錯誤，整包通殺後真正有料的會最快反彈。</span></div>\n<div class=\"sector-chip bullish\"><span class=\"badge bullish\">📈 看多</span> <strong>光設備</strong><span class=\"sector-reason\"> — 手上有光設備且走勢非常好，持續加碼到部位偏高。</span></div>\n\n  <div class='section-title'>總體經濟觀點</div>\n        <div class=\"macro-row\">\n          <div class=\"macro-topic\">美股走勢與風險</div>\n          <div><span class=\"badge bearish\">📉 看空</span><span class=\"macro-view\"> NASDAQ持續破底，走勢越來越像去年3-4月Liberation Day前的狀態，可能出現中東地緣政治引發的大跌事件。目前策略是反彈時減碼，等待更好的加碼時機。</span></div>\n        </div>\n\n        <div class=\"macro-row\">\n          <div class=\"macro-topic\">台股風險</div>\n          <div><span class=\"badge neutral\">➡️ 中立</span><span class=\"macro-view\"> 台股部位水位打得很高，美股水位降低。若美股出現全面破底或地緣政治升溫，台股難以幸免。強勢股若跌破關鍵均線也會賣出。</span></div>\n        </div>\n\n        <div class=\"macro-row\">\n          <div class=\"macro-topic\">CAPEX過高對科技巨頭的影響</div>\n          <div><span class=\"badge bearish\">📉 看空</span><span class=\"macro-view\"> 市場開始擔憂科技巨頭花太多CAPEX在AI上，ROI不確定，可能擠壓現金流。相較之下蘋果因未大量投入CAPEX而表現相對強勢。</span></div>\n        </div>\n\n        <div class=\"macro-row\">\n          <div class=\"macro-topic\">中東地緣政治風險</div>\n          <div><span class=\"badge bearish\">📉 看空</span><span class=\"macro-view\"> 美國大兵正大幅向中東進擊，可能演變成全面戰爭。打起來瞬間可能大跌，但之後可能一路漲。這是潛在的黑天鵝事件。</span></div>\n        </div>\n\n  <div class=\"footer\">由 Claude 自動分析 · 僅供參考，非投資建議</div>"}, {"id": "EP647 _ 🍬", "title": "EP647 _ 🍬", "date": "2026-03-28", "html": "<div class=\"header\">\n    <div class=\"meta\">股癌 Podcast 分析報告 · 2026-03-28</div>\n    <h1>EP647 _ 🍬</h1>\n  </div>\n\n  <div class='summary-box'><p>本集股癌主要分享AI工具在投資實務中的應用心得，認為AI是漸進式提升而非顛覆性取代。市場觀點方面，他維持區間盤看法，持續加碼光通訊相關持股，並關注CPU作為新題材。此外也討論了OpenAI停止SORA對存儲需求的影響，以及馬斯克TeraFab計畫對相關供應鏈的潛在利多與對Tesla股東的財務風險。</p></div>\n\n  <div class=\"quick-bar\"><span class=\"quick-tag bullish\">NET</span><span class=\"quick-tag bullish\">PLTR</span><span class=\"quick-tag bullish\">SpaceX</span><span class=\"quick-tag bullish\">AMD</span><span class=\"quick-tag vague\">3081</span><span class=\"quick-tag vague\">COHR</span><span class=\"quick-tag vague\">LITE</span><span class=\"quick-tag vague\">AAOI</span><span class=\"quick-tag vague\">ALAB</span><span class=\"quick-tag vague\">3413</span><span class=\"quick-tag vague\">3583</span><span class=\"quick-tag vague\">3680</span><span class=\"quick-tag vague\">6187</span><span class=\"quick-tag vague\">3131</span><span class=\"quick-tag vague\">6752</span><span class=\"quick-tag vague\">6689</span><span class=\"quick-tag vague\">4979</span><span class=\"quick-tag vague\">6111</span><span class=\"quick-tag vague\">AMAT</span><span class=\"quick-tag vague\">ASML</span><span class=\"quick-tag vague\">2404</span><span class=\"quick-tag vague\">3443</span><span class=\"quick-tag vague\">2327</span><span class=\"quick-tag vague\">2492</span></div>\n\n  <div class='section-title'>🔍 詞彙解讀（股癌說的「光」「低軌」是指…）</div>\n        <div class=\"vague-card bullish\">\n          <div cla lockquote>\n        </div>\n\n        <div class=\"card bullish\" data-ticker=\"\" data-name=\"SpaceX\" data-market=\"US\">\n          <div class=\"card-header\">\n            <span class=\"stock-name\">SpaceX</span>\n            <span class=\"card-meta\"><span class=\"market-tag\">US</span></span>\n          </div>\n          <span class=\"badge bullish\">📈 看多</span>\n          <p class=\"reason\">若上市一定會買，不管估值先買約1-2%部位，看對再加碼。但TeraFab帶來財務風險是擔心的點。</p>\n          <blockquote>「SpaceX上市你會買嗎...會買的話會買佔比多少 ...他上市我一定會買 而且我是不管估價怎麼樣 我就會先買 那會買多少 不知道就最多就一兩趴吧」</blockquote>\n        </div>\n\n        <div class=\"card mention\" data-ticker=\"2330\" data-name=\"台積電\" data-market=\"TW\">\n          <div class=\"card-header\">\n            <span class=\"stock-name\">台積電</span>\n            <span class=\"card-meta\"><code class=\"ticker\">2330</code><a href=\"https://tw.stock.yahoo.com/quote/2330\" target=\"_blank\" title=\"開啟 2330 K線圖\" class=\"chart-btn\"><svg viewBox=\"0 0 20 20\" fill=\"currentColor\" width=\"14\" height=\"14\"><rect x=\"2\" y=\"10\" width=\"3\" height=\"8\" rx=\"1\"/><rect x=\"8.5\" y=\"5\" width=\"3\" height=\"13\" rx=\"1\"/><rect x=\"15\" y=\"2\" width=\"3\" height=\"16\" rx=\"1\"/></svg></a><span class=\"market-tag\">TW</span><button class=\"wl-btn\" data-ticker=\"2330\" data-name=\"台積電\" data-market=\"TW\" title=\"加入自選股\">⭐</button></span>\n          </div>\n          <span class=\"badge mention\">💬 僅提及</span>\n          <p class=\"reason\">在討論馬斯克TeraFab時提到，馬斯克想在台積電做AI5/AI6但價格談不攏，轉向三星尋求更便宜價格。</p>\n          <blockquote>「馬斯克整天在殺價 他其實AI5、AI6 他也想在台積電這邊做 什麼東西過不去 價格 他想要更便宜的價格 那三星要給他更便宜的價格」</blockquote>\n        </div>\n\n        <div class=\"card bullish\" data-ticker=\"AMD\" data-name=\"AMD\" data-market=\"US\">\n          <div class=\"card-header\">\n            <span class=\"stock-name\">AMD</span>\n            <span class=\"card-meta\"><code class=\"ticker\">AMD</code><a href=\"https://finance.yahoo.com/quote/AMD\" target=\"_blank\" title=\"開啟 AMD K線圖\" class=\"chart-btn\"><svg viewBox=\"0 0 20 20\" fill=\"currentColor\" width=\"14\" height=\"14\"><rect x=\"2\" y=\"10\" width=\"3\" height=\"8\" rx=\"1\"/><rect x=\"8.5\" y=\"5\" width=\"3\" height=\"13\" rx=\"1\"/><rect x=\"15\" y=\"2\" width=\"3\" height=\"16\" rx=\"1\"/></svg></a><span class=\"market-tag\">US</span><button class=\"wl-btn\" data-ticker=\"AMD\" data-name=\"AMD\" data-market=\"US\" title=\"加入自選股\">⭐</button></span>\n          </div>\n          <span class=\"badge bullish\">📈 看多</span>\n          <p class=\"reason\">注意到AMD把一些產線都包起來了，CPU在推論應用上表現備受關注，可能帶出一波表現。</p>\n          <blockquote>「像AMD這邊我們就有注意到 他就把一些產線都包起來了 所以在接下來的一段時間 可能CPU也是有機會可以帶出一波表現的」</blockquote>\n        </div>\n\n        <div class=\"card mention\" data-ticker=\"2337\" data-name=\"旺宏\" data-market=\"TW\">\n          <div class=\"card-header\">\n            <span class=\"stock-name\">旺宏</span>\n            <span class=\"card-meta\"><code class=\"ticker\">2337</code><a href=\"https://tw.stock.yahoo.com/quote/2337\" target=\"_blank\" title=\"開啟 2337 K線圖\" class=\"chart-btn\"><svg viewBox=\"0 0 20 20\" fill=\"currentColor\" width=\"14\" height=\"14\"><rect x=\"2\" y=\"10\" width=\"3\" height=\"8\" rx=\"1\"/><rect x=\"8.5\" y=\"5\" width=\"3\" height=\"13\" rx=\"1\"/><rect x=\"15\" y=\"2\" width=\"3\" height=\"16\" rx=\"1\"/></svg></a><span class=\"market-tag\">TW</span><button class=\"wl-btn\" data-ticker=\"2337\" data-name=\"旺宏\" data-market=\"TW\" title=\"加入自選股\">⭐</button></span>\n          </div>\n          <span class=\"badge mention\">💬 僅提及</span>\n          <p class=\"reason\">以鄭麗君老公買旺宏等多年最終獲利的例子，說明深蹲等待的投資風格。</p>\n          <blockquote>「你沒有看到那個什麼 鄭麗君她老公買那個旺宏嗎 那個多厲害 那個等幾年 然後現在贏」</blockquote>\n        </div>\n\n  <div class='section-title'>類股 / 產業</div><div class=\"sector-chip bullish\"><span class=\"badge bullish\">📈 看多</span> <strong>光通訊</strong><span class=\"sector-reason\"> — 近期持續加碼光通訊持股，美股和台股都往光通訊方向靠攏，表現極好。美股本來光通訊就多，台股也在回檔後加碼。有多檔光通個股漲停。</span></div>\n<div class=\"sector-chip bullish\"><span class=\"badge bullish\">📈 看多</span> <strong>CPU相關</strong><span class=\"sector-reason\"> — 近期新鮮熱門話題，推論應用上CPU表現備受關注，也開始出現產能卡住狀況。自己買CPU相關設備股。</span></div>\n<div class=\"sector-chip bullish\"><span class=\"badge bullish\">📈 看多</span> <strong>存儲/NAND</strong><span class=\"sector-reason\"> — 雖然SORA停止，但文生影需求仍在（如中國SeeDance），大量影片產出會帶動存儲需求。不認為會因SORA停止而遇到逆風。</span></div>\n<div class=\"sector-chip bullish\"><span class=\"badge bullish\">📈 看多</span> <strong>半導體設備/建廠供應鏈（美股、韓股）</strong><span class=\"sector-reason\"> — 馬斯克TeraFab計畫若執行，對設備、光罩、建廠配水配電配氣相關廠商是巨大利多，但受惠者主要在美股和韓股而非台股。</span></div>\n<div class=\"sector-chip neutral\"><span class=\"badge neutral\">➡️ 中立</span> <strong>被動元件</strong><span class=\"sector-reason\"> — 股癌明確表示已不玩被動元件報價題材，全部轉去光通訊。認為自己是被報價玩的，不排除後面被動元件會噴但不屬於他。</span></div>\n<div class=\"sector-chip bullish\"><span class=\"badge bullish\">📈 看多</span> <strong>AI Agent相關</strong><span class=\"sector-reason\"> — GTC後主線之一，看好Cloudflare和Palantir作為AI Agent受惠股，但目前贏家尚未完全確定，收費方式正從C-Base轉向Result-Base。</span></div>\n\n  <div class='section-title'>總體經濟觀點</div>\n        <div class=\"macro-row\">\n          <div class=\"macro-topic\">AI產業發展</div>\n          <div><span class=\"badge bullish\">📈 看多</span><span class=\"macro-view\"> 對AI維持大多頭心態，但認為AI有其限制，不應尬吹。實際應用上是漸進式提升生產力，而非立即顛覆。在coding領域提升最明確，但在投資績效上難以量化具體貢獻。</span></div>\n        </div>\n\n        <div class=\"macro-row\">\n          <div class=\"macro-topic\">台股與美股盤勢</div>\n          <div><span class=\"badge neutral\">➡️ 中立</span><span class=\"macro-view\"> 維持區間盤看法，亞股明顯強於美股。美股趨勢扭轉尚未確認，仍在盤底。中東局勢（伊朗）是短期不確定因素，油價可能回到100多。台股好做程度遠大於美股。</span></div>\n        </div>\n\n        <div class=\"macro-row\">\n          <div class=\"macro-topic\">SORA停止對存儲需求的影響</div>\n          <div><span class=\"badge bullish\">📈 看多</span><span class=\"macro-view\"> OpenAI停止SORA不代表存儲需求會停滯，中國的SeeDance等文生影平台仍蓬勃發展。存儲相關仍有好的發展可能性。OpenAI是因資源有限需聚焦在效率工具、coding生成等更直接產生收益的項目。</span></div>\n        </div>\n\n        <div class=\"macro-row\">\n          <div class=\"macro-topic\">馬斯克TeraFab計畫</div>\n          <div><span class=\"badge neutral\">➡️ 中立</span><span class=\"macro-view\"> 馬斯克想建自有晶圓廠的核心動機是壓價格而非真的缺產能。短期內要量產非常困難，需要大量傳統FAB設備與建廠投資（幾百億美元以上），對設備/光罩/建廠供應鏈是巨大利多，但對Tesla等馬斯克旗下公司股東是財務不確定性風險。</span></div>\n        </div>\n\n  <div class=\"footer\">由 Claude 自動分析 · 僅供參考，非投資建議</div>"}, {"id": "EP646 _ 🦙", "title": "EP646 _ 🦙", "date": "2026-03-28", "html": "<div class=\"header\">\n    <div class=\"meta\">股癌 Podcast 分析報告 · 2026-03-28</div>\n    <h1>EP646 _ 🦙</h1>\n  </div>\n\n  <div class='summary-box'><p>本集股癌分享參加投資公司聚會的心得，討論了美國數據中心缺電、SMR、散熱趨勢、光通訊作為AI 2.0的投資方向，以及記憶體（美光）利多不漲的現象。他認為當前AI趨勢不變，光通訊類股仍是資金匯聚方向，記憶體若轉弱可能釋放資金到其他漲價類股。美股破底觸發CTA砍倉，但他傾向逆勢買進。</p></div>\n\n  <div class=\"quick-bar\"><span class=\"quick-tag bullish\">6451</span><span class=\"quick-tag vague\">COHR</span><span class=\"quick-tag vague\">LITE</span></div>\n\n  <div class='section-title'>🔍 詞彙解讀（股癌說的「光」「低軌」是指…）</div>\n        <div class=\"vague-card bullish\">\n          <div class=\"vague-header\">\n            <span class=\"vague-term\">「光」</span>\n            <span class=\"badge bullish\">📈 看多</span>\n          </div>\n          <p class=\"vague-interp\">光通訊（optical interconnect/networking）相關族群，包含光模組、光設備、CPO等，被視為AI 2.0的投資方向</p>\n          <blockquote>「我認為現在趨勢已經走得很明顯就是往光的方向去走甚至有一個說法是說反正光就是AI的2.0...像台股的這些光的類股或是美股光的類股都還是在很強勢的狀態」</blockquote>\n          <div class=\"cand-list\"><div class=\"cand-row\" data-cand-ticker=\"6451\" data-cand-name=\"訊芯-KY\" data-cand-market=\"TW\"><code class=\"ticker\">6451</code><a href=\"https://tw.stock.yahoo.com/quote/6451\" target=\"_blank\" title=\"開啟 6451 K線圖\" class=\"chart-btn\"><svg viewBox=\"0 0 20 20\" fill=\"currentColor\" width=\"14\" height=\"14\"><rect x=\"2\" y=\"10\" width=\"3\" height=\"8\" rx=\"1\"/><rect x=\"8.5\" y=\"5\" width=\"3\" height=\"13\" rx=\"1\"/><rect x=\"15\" y=\"2\" width=\"3\" height=\"16\" rx=\"1\"/></svg></a> <span class=\"market-tag\">TW</span> <span class=\"cand-name\">訊芯-KY</span><span class=\"cand-reason\"> ullish\">📈 看多</span> <strong>光通訊（interconnect/networking）</strong><span class=\"sector-reason\"> — 資金明顯匯聚方向，被視為AI 2.0，持續瘋狂上修，給予非常高的PE倍數。台股和美股光通類股都在強勢狀態，回檔是站在買方的機會</span></div>\n<div class=\"sector-chip bullish\"><span class=\"badge bullish\">📈 看多</span> <strong>散熱</strong><span class=\"sector-reason\"> — 晶片TDP越來越高，TAM只會越來越大。未來可能從冷水進階到冷煤/冰水，甚至重新討論immersion cooling的可能性</span></div>\n<div class=\"sector-chip neutral\"><span class=\"badge neutral\">➡️ 中立</span> <strong>記憶體</strong><span class=\"sector-reason\"> — 基本面今年一整年都很好，NAND漲價可能跑贏DRAM（AI存儲需求強勁），但股價利多不漲，外資開始調降目標價。若記憶體轉弱橫盤，資金可能流向其他漲價類股，對整體市場反而更好</span></div>\n<div class=\"sector-chip neutral\"><span class=\"badge neutral\">➡️ 中立</span> <strong>被動元件</strong><span class=\"sector-reason\"> — 有漲價題材但要區分驅動因素：部分是因銀價上漲導致成本轉嫁，高階MLCC和電感（TELVR）則是需求面供需失衡，後者較值得關注</span></div>\n<div class=\"sector-chip neutral\"><span class=\"badge neutral\">➡️ 中立</span> <strong>SMR（小型模組化反應爐）</strong><span class=\"sector-reason\"> — 作為onsite發電方案被討論，但實際佔地兩個足球場遠超想像，環評問題多，股癌自己未佈局也不熟悉</span></div>\n<div class=\"sector-chip bullish\"><span class=\"badge bullish\">📈 看多</span> <strong>電力/Power相關</strong><span class=\"sector-reason\"> — 數據中心缺電是確定趨勢，onsite發電方式持續被討論，power元件也在漲價</span></div>\n\n  <div class='section-title'>總體經濟觀點</div>\n        <div class=\"macro-row\">\n          <div class=\"macro-topic\">美國數據中心電力需求</div>\n          <div><span class=\"badge neutral\">➡️ 中立</span><span class=\"macro-view\"> 最缺的不是電力產出而是電網建置跟不上，因此onsite發電方式（包括SMR）持續被討論，但SMR佔地比想像中大（兩個足球場），實際推進可能面臨環評等問題</span></div>\n        </div>\n\n        <div class=\"macro-row\">\n          <div class=\"macro-topic\">伊朗戰爭與地緣政治不確定性</div>\n          <div><span class=\"badge neutral\">➡️ 中立</span><span class=\"macro-view\"> 川普可能像打貿易戰一樣跳恰恰，先退再進，油價若開始橫盤可作為先期蹲點指標。不確定性高時不要把部位壓太滿，但也不要空手</span></div>\n        </div>\n\n        <div class=\"macro-row\">\n          <div class=\"macro-topic\">美股CTA砍倉與買點</div>\n          <div><span class=\"badge bullish\">📈 看多</span><span class=\"macro-view\"> 美股破底觸發CT 的P ratio</span></div>\n<div class=\"sector-chip neutral\"><span class=\"badge neutral\">➡️ 中立</span> <strong>SRAM/Pseudo SRAM相關</strong><span class=\"sector-reason\"> — 市場炒的SRAM類股是美麗的誤會（實為Pseudo SRAM非真正SRAM），但部分公司歪打正著有類似概念的產品線可能受惠</span></div>\n<div class=\"sector-chip neutral\"><span class=\"badge neutral\">➡️ 中立</span> <strong>ASIC陣營</strong><span class=\"sector-reason\"> — Meta砍單、Microsoft拿不到產能，但Google可能新增第三家Design House，後面會有新變局</span></div>\n<div class=\"sector-chip bearish\"><span class=\"badge bearish\">📉 看空</span> <strong>被動元件/漲價題材</strong><span class=\"sector-reason\"> — 漲價確認但市場已麻木，國巨只動一下其他都沒動，漲價題材短期可能無法有效推動股價</span></div>\n<div class=\"sector-chip bullish\"><span class=\"badge bullish\">📈 看多</span> <strong>記憶體族群</strong><span class=\"sector-reason\"> — 1月業績大爆發的公司有低價庫存可多次使用，不會是一次性爆發</span></div>\n\n  <div class='section-title'>總體經濟觀點</div>\n        <div class=\"macro-row\">\n          <div class=\"macro-topic\">降息與估值天花板</div>\n          <div><span class=\"badge neutral\">➡️ 中立</span><span class=\"macro-view\"> 部分股票（如銅類股、NVIDIA）的估值可能已經被市場定價完畢，若沒有降息或降息預期，股價可能難以再推高</span></div>\n        </div>\n\n        <div class=\"macro-row\">\n          <div class=\"macro-topic\">漲價題材疲乏</div>\n          <div><span class=\"badge bearish\">📉 看空</span><span class=\"macro-view\"> 市場對漲價題材已經麻木，即使確認漲價幅度大，股價也不一定有顯著反應，例如被動元件國巨只動一下，其他預期大噴的都沒動</span></div>\n        </div>\n\n  <div class=\"footer\">由 Claude 自動分析 · 僅供參考，非投資建議</div>"}, {"id": "EP644 _ 🦇", "title": "EP644 | 🦇", "date": "2026-04-01", "html": "<div class=\"header\">\n    <div class=\"meta\">股癌 Podcast 分析報告 · 2026-04-01</div>\n    <h1>EP644 | 🦇</h1>\n  </div>\n\n  <div class='summary-box'><p>本集股癌主要討論記憶體族群（旺宏/NOR Flash/eMMC）的強勢表現、美光即將公布財報可能毛利率達80%+、GTC前光通訊題材的風險提醒，以及美股可能破底的風險管理策略。他也分享了對Tesla供應鏈訂單樂觀的看法、軟體股不應一概而論的觀點，並強調持股輪動與維持流動性的重要性。</p></div>\n\n  <div class=\"quick-bar\"><span class=\"quick-tag bullish\">2337</span><span class=\"quick-tag bullish\">MU</span><span class=\"quick-tag bullish\">TSLA</span><span class=\"quick-tag iv><div class=\"cand-row\" data-cand-ticker=\"8086\" data-cand-name=\"宏捷科\" data-cand-market=\"TW\"><code class=\"ticker\">8086</code><a href=\"https://tw.stock.yahoo.com/quote/8086\" target=\"_blank\" title=\"開啟 8086 K線圖\" class=\"chart-btn\"><svg viewBox=\"0 0 20 20\" fill=\"currentColor\" width=\"14\" height=\"14\"><rect x=\"2\" y=\"10\" width=\"3\" height=\"8\" rx=\"1\"/><rect x=\"8.5\" y=\"5\" width=\"3\" height=\"13\" rx=\"1\"/><rect x=\"15\" y=\"2\" width=\"3\" height=\"16\" rx=\"1\"/></svg></a> <span class=\"market-tag\">TW</span> <span class=\"cand-name\">宏捷科</span><span class=\"cand-reason\"> — 穩懋與宏捷科同為砷化鎵代工廠，常被並列為「砷化鎵雙雄」，且都與光通訊題材相關，「東巴兩家」可能指這兩家砷化鎵公司</span><button class=\"wl-btn wl-btn-sm\" data-ticker=\"8086\" data-name=\"宏捷科\" data-market=\"TW\" title=\"加入自選股\">⭐</button></div></div>\n        </div>\n\n        <div class=\"vague-card bullish\">\n          <div class=\"vague-header\">\n            <span class=\"vague-term\">「載板廠」</span>\n            <span class=\"badge bullish\">📈 看多</span>\n          </div>\n          <p class=\"vague-interp\">ABF/BT基板製造商，因AI伺服器需求持續增加CAPEX投資</p>\n          <blockquote>「像我們也看到載板廠又要再去做更多的CAPEX投資然後有一些後段的封裝測試廠呢又再去做更多的廠房的投資其實這些都代表說大家對於未來都還是非常的看好」</blockquote>\n          <div class=\"cand-list\"><div class=\"cand-row\" data-cand-ticker=\"3037\" data-cand-name=\"欣興\" data-cand-market=\"TW\"><code class=\"ticker\">3037</code><a href=\"https://tw.stock.yahoo.com/quote/3037\" target=\"_blank\" title=\"開啟 3037 K線圖\" class=\"chart-btn\"><svg viewBox=\"0 0 20 20\" fill=\"currentColor\" width=\"14\" height=\"14\"><rect x=\"2\" y=\"10\" width=\"3\" height=\"8\" rx=\"1\"/><rect x=\"8.5\" y=\"5\" width=\"3\" height=\"13\" rx=\"1\"/><rect x=\"15\" y=\"2\" width=\"3\" height=\"16\" rx=\"1\"/></svg></a> <span class=\"market-tag\">TW</span> <span class=\"cand-name\">欣興</span><span class=\"cand-reason\"> — 台灣最大載板廠，股癌提到載板廠增加CAPEX時的主要對象</span><button class=\"wl-btn wl-btn-sm\" data-ticker=\"3037\" data-name=\"欣興\" data-market=\"TW\" title=\"加入自 function chartUrl(ticker, market) {
  if (!ticker) return '#';
  const t = ticker.toUpperCase();
  if ((market === 'TW' || market === 'ETF') && /^\d/.test(t))
    return 'https://tw.stock.yahoo.com/quote/' + t;
  return 'https://finance.yahoo.com/quote/' + t;
}

function showEpisode(id) {
  const ep = EPISODES.find(e => e.id === id);
  if (!ep) return;
  document.getElementById('content').innerHTML = '<div class="container">' + ep.html + '</div>';
  document.getElementById('current-title').textContent = ep.title;
  document.querySelectorAll('.ep-item').forEach(el => el.classList.remove('active'));
  const nav = document.getElementById('nav-' + id);
  if (nav) nav.classList.add('active');
  // 加上自選股按鈕的事件
  document.querySelectorAll('.wl-btn').forEach(btn => {
    btn.onclick = function() {
      const t = this.dataset.ticker, n = this.dataset.name, m = this.dataset.market;
      if (!t) return;
      if (isInWatchlist(t)) {
        removeFromWatchlist(t);
        this.textContent = '⭐';
        this.classList.remove('in-wl');
      } else {
        addToWatchlist(t, n, m, ep.title);
        this.textContent = '✅';
        this.classList.add('in-wl');
      }
    };
    if (isInWatchlist(btn.dataset.ticker)) {
      btn.textContent = '✅';
      btn.classList.add('in-wl');
    }
  });
  // 關閉手機側欄
  if (window.innerWidth <= 700) toggleSidebar(false);
}

function isInWatchlist(ticker) {
  if (!ticker) return false;
  return getWatchlist().some(w => w.ticker === ticker);
}

function getWatchlist() {
  return JSON.parse(localStorage.getItem('gooaye_wl') || '[]');
}

function addToWatchlist(ticker, name, market, fromEpisode) {
  const wl = getWatchlist();
  if (!wl.find(w => w.ticker === ticker)) {
    wl.push({ticker, name, market, fromEpisode, addedAt: new Date().toISOString().slice(0,10)});
    localStorage.setItem('gooaye_wl', JSON.stringify(wl));
    renderWatchlist();
  }
}

function removeFromWatchlist(ticker) {
  const wl = getWatchlist().filter(w => w.ticker !== ticker);
  localStorage.setItem('gooaye_wl', JSON.stringify(wl));
  renderWatchlist();
  // 同步更新當前頁面的按鈕狀態
  document.querySelectorAll('.wl-btn').forEach(btn => {
    if (btn.dataset.ticker === ticker) {
      btn.textContent = '⭐';
      btn.classList.remove('in-wl');
    }
  });
}

function renderWatchlist() {
  const wl = getWatchlist();
  const el = document.getElementById('tab-watchlist');
  if (!wl.length) {
    el.innerHTML = '<p class="wl-empty">點擊報告中的 ⭐ 加入自選股</p>';
    return;
  }
  el.innerHTML = wl.map(w => `
    <div class="wl-item">
      <div class="wl-top">
        <code class="ticker">${w.ticker}</code>
        <span class="market-tag">${w.market}</span>
        <a href="${chartUrl(w.ticker, w.market)}" target="_blank" class="chart-btn" title="看K線">
          <svg viewBox="0 0 20 20" fill="currentColor" width="14" height="14">
            <rect x="2" y="10" width="3" height="8" rx="1"/>
            <rect x="8.5" y="5" width="3" height="13" rx="1"/>
            <rect x="15" y="2" width="3" height="16" rx="1"/>
          </svg>
        </a>
      </div>
      <div class="wl-name">${w.name}</div>
      <div class="wl-from">來自 ${w.fromEpisode} · 加入 ${w.addedAt}</div>
      <button class="wl-remove" onclick="removeFromWatchlist('${w.ticker}')">✕ 移除</button>
    </div>
  `).join('');
}

function switchTab(tab) {
  document.getElementById('tab-episodes').style.display = tab === 'episodes' ? '' : 'none';
  document.getElementById('tab-watchlist').style.display = tab === 'watchlist' ? '' : 'none';
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', (i === 0) === (tab === 'episodes'));
  });
  if (tab === 'watchlist') renderWatchlist();
}

function toggleSidebar(force) {
  const sb = document.getElementById('sidebar');
  const ov = document.getElementById('overlay');
  const open = force !== undefined ? force : !sb.classList.contains('open');
  sb.classList.toggle('open', open);
  ov.classList.toggle('show', open);
}

// 初始化
showEpisode('EP653 _ 🕊️');
renderWatchlist();
</script>
