<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>股癌分析器</title>
<style>
:root {
  --green:#16a34a;--green-bg:#f0fdf4;--green-border:#bbf7d0;
  --red:#dc2626;--red-bg:#fef2f2;--red-border:#fecaca;
  --gray:#6b7280;--gray-bg:#f9fafb;
  --blue:#2563eb;--radius:12px;
  --font:-apple-system,"Noto Sans TC",sans-serif;
  --sidebar:270px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:#f3f4f6;color:#111827;font-size:16px;line-height:1.6;display:flex;height:100dvh;overflow:hidden}

/* ── Sidebar ── */
#sidebar{width:var(--sidebar);flex-shrink:0;background:#1e293b;color:#f1f5f9;display:flex;flex-direction:column;height:100dvh;overflow:hidden;transition:transform .25s;z-index:200}
#sidebar-header{padding:16px;font-weight:700;font-size:1rem;border-bottom:1px solid #334155;flex-shrink:0}
.tab-bar{display:flex;border-bottom:1px solid #334155;flex-shrink:0}
.tab{flex:1;padding:10px;background:none;border:none;color:#94a3b8;font-size:0.85rem;cursor:pointer;font-weight:600}
.tab.active{color:#f1f5f9;border-bottom:2px solid #38bdf8}
#tab-episodes{overflow-y:auto;flex:1}
#tab-watchlist{overflow-y:auto;flex:1;display:none;padding:8px}
.ep-item{padding:12px 16px;cursor:pointer;border-bottom:1px solid #334155;transition:background .15s}
.ep-item:hover,.ep-item.active{background:#334155}
.ep-date{font-size:0.72rem;color:#94a3b8;margin-bottom:2px}
.ep-title{font-size:0.88rem;font-weight:500;line-height:1.3}

/* ── Watchlist ── */
.wl-item{background:#334155;border-radius:10px;padding:12px;margin-bottom:8px}
.wl-top{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.wl-name{font-size:0.85rem;color:#cbd5e1;margin-bottom:2px}
.wl-from{font-size:0.72rem;color:#64748b}
.wl-remove{margin-top:6px;background:none;border:1px solid #475569;color:#94a3b8;border-radius:6px;padding:2px 8px;font-size:0.75rem;cursor:pointer}
.wl-remove:hover{background:#475569}
.wl-empty{color:#64748b;font-size:0.85rem;text-align:center;padding:24px 8px}

/* ── Overlay (mobile) ── */
#overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100}

/* ── Main ── */
#main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0}
#topbar{background:#fff;border-bottom:1px solid #e5e7eb;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-shrink:0}
#hamburger{background:none;border:none;font-size:1.3rem;cursor:pointer;display:none;color:#374151}
#current-title{font-size:0.95rem;font-weight:600;color:#111827;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#content{flex:1;overflow-y:auto;padding:16px}
#content .container{max-width:680px;margin:0 auto}

/* ── Episode content styles (copied from standalone) ── */
.header{background:#111827;color:#fff;border-radius:var(--radius);padding:20px;margin-bottom:16px}
.header h1{font-size:1.25rem;font-weight:700;margin-bottom:4px}
.header .meta{font-size:0.8rem;color:#9ca3af}
.summary-box{background:#fff;border-radius:var(--radius);padding:16px;margin-bottom:16px;border-left:4px solid #2563eb}
.summary-box p{color:#374151;font-size:0.95rem}
.quick-bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.quick-tag{padding:6px 12px;border-radius:20px;font-size:0.85rem;font-weight:600}
.quick-tag.bullish{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
.quick-tag.bearish{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}
.quick-tag.vague{background:#f5f3ff;color:#7c3aed;border:1px solid #ddd6fe}
.section-title{font-size:0.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:#6b7280;margin:20px 0 10px}
.card{background:#fff;border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;border-left:4px solid #e5e7eb}
.card.bullish{border-left-color:var(--green)}
.card.bearish{border-left-color:var(--red)}
.card.neutral{border-left-color:#d1d5db}
.card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px;gap:8px}
.stock-name{font-weight:700;font-size:1rem}
.card-meta{display:flex;gap:4px;align-items:center;flex-shrink:0;flex-wrap:wrap}
code.ticker{background:#1e293b;color:#e2e8f0;font-size:0.8rem;padding:2px 7px;border-radius:6px;font-family:monospace}
a.chart-btn{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:5px;margin-left:4px;background:#e0f2fe;color:#0369a1;vertical-align:middle;text-decoration:none}
a.chart-btn:hover{background:#bae6fd}
.market-tag{background:#e0e7ff;color:#3730a3;font-size:0.75rem;padding:2px 6px;border-radius:6px}
.reason{font-size:0.9rem;color:#374151;margin-top:6px}
blockquote{font-size:0.82rem;color:#6b7280;margin-top:6px;padding-left:10px;border-left:2px solid #d1d5db;font-style:italic}
.empty{color:#9ca3af;font-size:0.9rem;text-align:center;padding:16px}
.badge{display:inline-block;font-size:0.78rem;font-weight:600;padding:2px 8px;border-radius:20px}
.badge.bullish{background:var(--green-bg);color:var(--green)}
.badge.bearish{background:var(--red-bg);color:var(--red)}
.badge.neutral{background:var(--gray-bg);color:var(--gray)}
.badge.mention{background:#eff6ff;color:var(--blue)}
.macro-row{background:#fff;border-radius:var(--radius);padding:12px 14px;margin-bottom:8px}
.macro-topic{font-weight:600;font-size:0.9rem;margin-bottom:4px}
.macro-view{font-size:0.88rem;color:#374151}
.sector-chip{background:#fff;border-radius:var(--radius);padding:10px 14px;margin-bottom:8px;font-size:0.88rem}
.sector-reason{color:#6b7280}
.vague-card{background:#fff;border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;border-left:4px solid #a78bfa}
.vague-card.bullish{border-left-color:var(--green)}
.vague-card.bearish{border-left-color:var(--red)}
.vague-header{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.vague-term{font-weight:700;font-size:1rem;color:#111827}
.vague-interp{font-size:0.88rem;color:#374151;margin-bottom:6px}
.cand-list{margin-top:10px;display:flex;flex-direction:column;gap:6px}
.cand-row{font-size:0.85rem;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px;padding:6px 10px;background:#f8fafc;border-radius:8px}
.cand-name{font-weight:600}
.cand-reason{color:#6b7280}
.wl-btn{background:none;border:none;cursor:pointer;font-size:1rem;padding:0 2px;line-height:1;opacity:.5;transition:opacity .15s}
.wl-btn:hover,.wl-btn.in-wl{opacity:1}
.wl-btn-sm{font-size:0.8rem;margin-left:4px}
.footer{text-align:center;font-size:0.75rem;color:#9ca3af;padding:24px 0 8px}

/* ── Mobile ── */
@media(max-width:700px){
  #sidebar{position:fixed;left:0;top:0;height:100dvh;transform:translateX(-100%)}
  #sidebar.open{transform:translateX(0)}
  #overlay.show{display:block}
  #hamburger{display:block}
  #main{width:100%}
}
</style>
</head>

<script>
const EPISODES = [{"id": "EP647 _ 🍬", "title": "EP647 _ 🍬", "date": "2026-03-28", "html": "<div class=\"header\">\n    <div class=\"meta\">股癌 Podcast 分析報告 · 2026-03-28</div>\n    <h1>EP647 _ 🍬</h1>\n  </div>\n\n  <div class='summary-box'><p>本集股癌主要討論三大主題：(1) AI實際工作應用的體驗與反思，認為AI是漸進式提升工具而非顛覆性取代；(2) OpenAI停止SORA影片生成服務對存儲需求的影響，以及AI影片生成的成本與版權限制；(3) 馬斯克TeraFab計畫的分析，認為短期對Tesla股東是財務風險，但對半導體設備與廠務供應商是利多。盤勢方面，維持區間盤看法，持續加碼光通訊相關標的，並關注CPU推論應用的新題材。</p></div>\n\n  <div class=\"quick-bar\"><span class=\"quick-tag bullish\">NET</span><span class=\"quick-tag bullish\">PLTR</span><span class=\"quick-tag bullish\">AMD</span><span class=\"quick-tag bullish\">SpaceX</span><span class=\"quick-tag vague\">3665</span><span class=\"quick-tag vague\">COHR</span><span class=\"quick-tag vague\">LITE</span><span class=\"quick-tag vague\">ALAB</span><span class=\"quick-tag vague\">AAOI</span><span class=\"quick-tag vague\">INTC</span><span class=\"quick-tag vague\">2327</span><span class=\"quick-tag vague\">2492</span><span class=\"quick-tag vague\">2351</span><span class=\"quick-tag vague\">AMAT</span><span class=\"quick-tag vague\">ASML</span><span class=\"quick-tag vague\">3589</span><span class=\"quick-tag vague\">3615</span></div>\n\n  <div class='section-title'>🔍 詞彙解讀（股癌說的「光」「低軌」是指…）</div>\n        <div class=\"vague-card bullish\">\n          <div class=\"vague-header\">\n            <span class=\"vague-term\">「光」</span>\n            <span class=\"badge bullish\">📈 看多</span>\n          </div>\n          <p class=\"vague-interp\">光通訊族群，包含CPO（共封裝光學）及相關光通訊設備與元件廠商</p>\n          <blockquote>「那目前非常明顯就是在光跟CPU這邊 其實特別是像美股這邊開始往大量的光去靠著 我本來是台股光比較相對少嘛 那美股的光是多的...然後在台股這邊呢 在上坡的一個回檔之後 我自己也是選擇把東西往光的方向去靠 然後突然間覺得說這個股票市場好簡單」</blockquote>\n          <div class=\"cand-list\"><div class=\"cand-row\" data-cand-ticker=\"3665\" data-cand-name=\"訊芯\" data-cand-market=\"TW\"><code class=\"ticker\">3665</code><a href=\"https://tw.stock.yahoo.com/quote/3665\" target=\"_blank\" title=\"開啟 3665 K線圖\" class=\"chart-btn\"><svg viewBox=\"0 0 20 20\" fill=\"currentColor\" width=\"14\" height=\"14\"><rect x=\"2\" y=\"10\" width=\"3\" height=\"8\" rx=\"1\"/><rect x=\"8.5\" y=\"5\" width=\"3\" height=\"13\" rx=\"1\"/><rect x=\"15\" y=\"2\" width=\"3\" height=\"16\" rx=\"1\"/></svg></a> <span class=\"market-tag\">TW</span> <span class=\"cand-name\">訊芯</span><span class=\"cand-reason\"> — 逐字稿提到台股光通有多支漲停且有進入處置的，訊芯是CPO相關光通訊台股標的</span><button class=\"wl-btn wl-btn-sm\" data-ticker=\"3665\" data-name=\"訊芯\" data-market=\"TW\" title=\"加入自選股\">⭐</button></div><div class=\"cand-row\" data-cand-ticker=\"COHR\" data-cand-name=\"Coherent\" data-cand-market=\"US\"><code class=\"ticker\">COHR</code><a href=\"https://finance.yahoo.com/quote/COHR\" target=\"_blank\" title=\"開啟 COHR K線圖\" class=\"chart-btn\"><svg viewBox=\"0 0 20 20\" fill=\"currentColor\" width=\"14\" height=\"14\"><rect x=\"2\" y=\"10\" width=\"3\" height=\"8\" rx=\"1\"/><rect x=\"8.5\" y=\"5\" width=\"3\" height=\"13\" rx=\"1\"/><rect x=\"15\" y=\"2\" width=\"3\" height=\"16\" rx=\"1\"/></svg></a> <span class=\"market-tag\">US</span> <span class=\"cand-name\">Coherent</span><span class=\"cand-reason\"> — 股癌提到美股光通持股很多，且把其他部位換到美股光通，Coherent是美股主要光通訊標的</span><button class=\"wl-btn wl-btn-sm\" data-ticker=\"COHR\" data-name=\"Coherent\" data-market=\"US\" title=\"加入自選股\">⭐</button></div><div class=\"cand-row\" data-cand-ticker=\"LITE\" data-cand-name=\"Lumentum\" data-cand-market=\"US\"><code class=\"ticker\">LITE</code><a href=\"https://finance.yahoo.com/quote/LITE\" target=\"_blank\" title=\"開啟 LITE K線圖\" class=\"chart-btn\"><svg viewBox=\"0 0 20 20\" fill=\"currentColor\" width=\"14\" height=\"14\"><rect x=\"2\" y=\"10\" width=\"3\" height=\"8\" rx=\"1\"/><rect x=\"8.5\" y=\"5\" width=\"3\" height=\"13\" rx=\"1\"/><rect x=\"15\" y=\"2\" width=\"3\" height=\"16\" rx=\"1\"/></svg></a> <span class=\"market-tag\">US</span> <span class=\"cand-name\">Lumentum</span><span class=\"cand-reason\"> — 美股光通訊龍頭之一，股癌明確說美股的光是多的且持續加碼</span><button class=\ iewBox=\"0 0 20 20\" fill=\"currentColor\" width=\"14\" height=\"14\"><rect x=\"2\" y=\"10\" width=\"3\" height=\"8\" rx=\"1\"/><rect x=\"8.5\" y=\"5\" width=\"3\" height=\"13\" rx=\"1\"/><rect x=\"15\" y=\"2\" width=\"3\" height=\"16\" rx=\"1\"/></svg></a><span class=\"market-tag\">TW</span><button class=\"wl-btn\" data-ticker=\"2330\" data-name=\"台積電\" data-market=\"TW\" title=\"加入自選股\">⭐</button></span>\n          </div>\n          <span class=\"badge mention\">💬 僅提及</span>\n          <p class=\"reason\">提到馬斯克想在台積電做AI5、AI6晶片但因價格談不攏轉向三星，以及台積電兩奈米技術轉移的難度。</p>\n          <blockquote>「馬斯克整天在殺價 他其實AI5、AI6 他也想在台積電這邊做 什麼東西過不去 價格 他想要更便宜的價格」</blockquote>\n        </div>\n\n        <div class=\"card mention\" data-ticker=\"\" data-name=\"三星\" data-market=\"其他\">\n          <div class=\"card-header\">\n            <span class=\"stock-name\">三星</span>\n            <span class=\"card-meta\"><span class=\"market-tag\">其他</span></span>\n          </div>\n          <span class=\"badge mention\">💬 僅提及</span>\n          <p class=\"reason\">三星為與台積電競爭，提供馬斯克更便宜的價格與特殊禮遇（開放Fab設辦公室巡產），馬斯克與三星密集度高，可能協助在Austin建廠。</p>\n          <blockquote>「三星要給他更便宜的價格 而且三星願意去打開他的Fab 進來什麼設一個辦公室 然後讓他可以在裡面巡產」</blockquote>\n        </div>\n\n        <div class=\"card bullish\" data-ticker=\"NET\" data-name=\"Cloudflare\" data-market=\"US\">\n          <div class=\"card-header\">\n            <span class=\"stock-name\">Cloudflare</span>\n            <span class=\"card-meta\"><code class=\"ticker\">NET</code><a href=\"https://finance.yahoo.com/quote/NET\" target=\"_blank\" title=\"開啟 NET K線圖\" class=\"chart-btn\"><svg viewBox=\"0 0 20 20\" fill=\"currentColor\" width=\"14\" height=\"14\"><rect x=\"2\" y=\"10\" width=\"3\" height=\"8\" rx=\"1\"/><rect x=\"8.5\" y=\"5\" width=\"3\" height=\"13\" rx=\"1\"/><rect x=\"15\" y=\"2\" width=\"3\" height=\"16\" rx=\"1\"/></svg></a><span class=\"market-tag\">US</span><button class=\"wl-btn\" data-ticker=\"NET\" data-name=\"Cloudflare\" data-market=\"US\" title=\"加入自選股\">⭐</button></span>\n          </div>\n          <span class=\"badge bullish\">📈 看多</span>\n          <p class=\"reason\">認為是AI Agent最實質受惠股之一，因為Agent要爬取資料都會經過Cloudflare的收費牆，已在各處架好收費站，AI Agent越多對其收益越大。</p>\n          <blockquote>「AI Agent AI Agent以台股來講的話...那在美股的話 那可能比較偏向是像COWFLARE 它就是AI Agent我覺得最實質的受惠股之一」</blockquote>\n        </div>\n\n        <div class=\"card bullish\" data-ticker=\"PLTR\" data-name=\"Palantir\" data-market=\"US\">\n          <div class=\"card-header\">\n            <span class=\"stock-name\">Palantir</span>\n            <span class=\"card-meta\"><code class=\"ticker\">PLTR</code><a href=\"https://finance.yahoo.com/quote/PLTR\" target=\"_blank\" title=\"開啟 PLTR K線圖\" class=\"chart-btn\"><svg viewBox=\"0 0 20 20\" fill=\"currentColor\" width=\"14\" height=\"14\"><rect x=\"2\" y=\"10\" width=\"3\" height=\"8\" rx=\"1\"/><rect x=\"8.5\" y=\"5\" width=\"3\" height=\"13\" rx=\"1\"/><rect x=\"15\" y=\"2\" width=\"3\" height=\"16\" rx=\"1\"/></svg></a><span class=\"market-tag\">US</span><button class=\"wl-btn\" data-ticker=\"PLTR\" data-name=\"Palantir\" data-market=\"US\" title=\"加入自選股\">⭐</button></span>\n          </div>\n          <span class=\"badge bullish\">📈 看多</span>\n          <p class=\"reason\">認為在2B的AI Agent應用做得非常好，拿到很多政府標案，未來一段時間都會不錯。但承認估值很貴，用PE Ratio算不出來。</p>\n          <blockquote>「Parentier也可以算是一個 雖然它不是2C的 可是在2B的應用已經是做得非常的好 然後拿到很多政府的標案」</blockquote>\n        </div>\n\n        <div class=\"card bullish\" data-ticker=\"AMD\" data-name=\"AMD\" data-market=\"US\">\n          <div class=\"card-header\">\n            <span class=\"stock-name\">AMD</span>\n            <span class=\"card-meta\"><code class=\"ticker\">AMD</code><a href=\"https://finance.yahoo.com/quote/AMD\" target=\"_blank\" title=\"開啟 AMD K線圖\" class=\"chart-btn\"><svg viewBox=\"0 0 20 20\" fill=\"currentColor\" width=\"14\" height=\"14\"><rect x=\"2\" y=\"10\" width=\"3\" height=\"8\" rx=\"1\"/><rect x=\"8.5\" y=\"5\" width=\"3\" height=\"13\" rx=\"1\"/><rect x=\"15\" y=\"2\" width=\"3\" height=\"16\" rx=\"1\"/></svg></a><span class=\"market-tag\">US</span><button class=\"wl-btn\" data-ticker=\"AMD\" data-name=\"AMD\" data-market=\"US\" title=\"加入自選股\">⭐</button></span>\n          </div>\n          <span class=\"badge bullish\">📈 看多</span>\n          <p class=\"reason\">注意到AMD把一些產線都包起來了，暗示CPU產能緊張，在推論應用上CPU表現備受關注，可能帶出一波行情。</p>\n          <blockquote>「像AMD這邊我們就有注意到 他就把一些產線都包起來了 所以在接下來的一段時間 可能CPU也是有機會可以帶出一波表現的」</blockquote>\n        </div>\n\n        <div class=\"card mention\" data-ticker=\"2337\" data-name=\"旺宏\" data-market=\"TW\">\n          <div class=\"card-header\">\n            <span class=\"stock-name\">旺宏</span>\n            <span class=\"card-meta\"><code class=\"ticker\">2337</code><a href=\"https://tw.stock.yahoo.com/quote/2337\" target=\"_blank\" title=\"開啟 2337 K線圖\" class=\"chart-btn\"><svg viewBox=\"0 0 20 20\" fill=\"currentColor\" width=\"14\" height=\"14\"><rect x=\"2\" y=\"10\" width=\"3\" height=\"8\" rx=\"1\"/><rect x=\"8.5\" y=\"5\" width=\"3\" height=\"13\" rx=\"1\"/><rect x=\"15\" y=\"2\" width=\"3\" height=\"16\" rx=\"1\"/></svg></a><span class=\"market-tag\">TW</span><button class=\"wl-btn\" data-ticker=\"2337\" data-name=\"旺宏\" data-market=\"TW\" title=\"加入自選股\">⭐</button></span>\n          </div>\n          <span class=\"badge mention\">💬 僅提及</span>\n          <p class=\"reason\">提到鄭麗君老公買旺宏等了好幾年最終獲利的案例，用來說明深蹲等待的投資風格。</p>\n          <blockquote>「你沒有看到那個什麼 鄭麗君她老公買那個旺宏嗎 那個多厲害 那個等幾年 然後現在贏」</blockquote>\n        </div>\n\n        <div class=\"card bullish\" data-ticker=\"\" data-name=\"SpaceX\" data-market=\"US\">\n          <div class=\"card-header\">\n            <span class=\"stock-name\">SpaceX</span>\n            <span class=\"card-meta\"><span class=\"market-tag\">US</span></span>\n          </div>\n          <span class=\"badge bullish\">📈 看多</span>\n          <p class=\"reason\">明確表示SpaceX上市一定會買，不管估值先買，初始配置約1-2%，看對再加碼。但擔心TeraFab可能影響旗下公司財務。</p>\n          <blockquote>「說我會不會買 我一定會買 他上市我一定會買 而且我是不管估價怎麼樣 我就會先買 那會買多少 不知道就最多就一兩趴吧」</blockquote>\n        </div>\n\n  <div class='section-title'>類股 / 產業</div><div class=\"sector-chip bullish\"><span class=\"badge bullish\">📈 看多</span> <strong>光通訊</strong><span class=\"sector-reason\"> — 明確表示大量加碼光通訊持股，台股與美股都在往光通方向靠攏。美股把拓油品換成光通，台股在回檔後也往光的方向靠。近期表現極好，一天三支漲停。</span></div>\n<div class=\"sector-chip bullish\"><span class=\"badge bullish\">📈 看多</span> <strong>CPU（伺服器推論用）</strong><span class=\"sector-reason\"> — 認為CPU在推論應用上備受關注，AMD已包下產線暗示產能緊張，CPU可能帶出新一波表現，是近期新題材。</span></div>\n<div class=\"sector-chip bullish\"><span class=\"badge bullish\">📈 看多</span> <strong>存儲/NAND</strong><span class=\"sector-reason\"> — 雖然SORA停止但不認為存儲會遇到逆風，中國SeeDance等影片生成仍蓬勃發展，大量影片產出會帶動存儲需求。</span></div>\n<div class=\"sector-chip bullish\"><span class=\"badge bullish\">📈 看多</span> <strong>半導體設備/廠務（美股、韓股）</strong><span class=\"sector-reason\"> — 馬斯克TeraFab計畫需要大量設備、廠務、配水配電配氣，投資規模可能達數百億美元，對相關供應商是超級巨大利多。但強調應找美股和韓股標的，非台股。</span></div>\n<div class=\"sector-chip bullish\"><span class=\"badge bullish\">📈 看多</span> <strong>電力/散熱/傳輸</strong><span class=\"sector-reason\"> — 提到GTC後主線聚焦電力散熱傳輸，稱為「超級老梗，每個人都知道買什麼」，暗示持續看好。</span></div>\n<div class=\"sector-chip neutral\"><span class=\"badge neutral\">➡️ 中立</span> <strong>被動元件</strong><span class=\"sector-reason\"> — 明確表示已不玩被動元件報價行情，覺得自己是「被報價玩」，全部轉去光通訊。但不排除後續被動元件報價可能噴上去。</span></div>\n\n  <div class='section-title'>總體經濟觀點</div>\n        <div class=\"macro-row\">\n          <div class=\"macro-topic\">AI產業發展</div>\n          <div><span class=\"badge bullish\">📈 看多</span><span class=\"macro-view\"> 對AI維持大多頭心態，但認為AI有其限制，不應尬吹。AI是漸進式提升工具，在coding領域提升最明確，但在投資績效上難以量化直接貢獻。</span></div>\n        </div>\n\n        <div class=\"macro-row\">\n          <div class=\"macro-topic\">台股 vs 美股盤勢</div>\n          <div><span class=\"badge neutral\">➡️ 中立</span><span class=\"macro-view\"> 認為目前是區間盤，亞股（台股）明顯強於美股。美股雖有川普言論造成的反彈，但整體仍在盤底，趨勢扭轉尚未看到。台股操作上採高賣低買、汰弱留強策略。</span></div>\n        </div>\n\n        <div class=\"macro-row\">\n          <div class=\"macro-topic\"> function chartUrl(ticker, market) {
  if (!ticker) return '#';
  const t = ticker.toUpperCase();
  if ((market === 'TW' || market === 'ETF') && /^\d/.test(t))
    return 'https://tw.stock.yahoo.com/quote/' + t;
  return 'https://finance.yahoo.com/quote/' + t;
}

function showEpisode(id) {
  const ep = EPISODES.find(e => e.id === id);
  if (!ep) return;
  document.getElementById('content').innerHTML = '<div class="container">' + ep.html + '</div>';
  document.getElementById('current-title').textContent = ep.title;
  document.querySelectorAll('.ep-item').forEach(el => el.classList.remove('active'));
  const nav = document.getElementById('nav-' + id);
  if (nav) nav.classList.add('active');
  // 加上自選股按鈕的事件
  document.querySelectorAll('.wl-btn').forEach(btn => {
    btn.onclick = function() {
      const t = this.dataset.ticker, n = this.dataset.name, m = this.dataset.market;
      if (!t) return;
      if (isInWatchlist(t)) {
        removeFromWatchlist(t);
        this.textContent = '⭐';
        this.classList.remove('in-wl');
      } else {
        addToWatchlist(t, n, m, ep.title);
        this.textContent = '✅';
        this.classList.add('in-wl');
      }
    };
    if (isInWatchlist(btn.dataset.ticker)) {
      btn.textContent = '✅';
      btn.classList.add('in-wl');
    }
  });
  // 關閉手機側欄
  if (window.innerWidth <= 700) toggleSidebar(false);
}

function isInWatchlist(ticker) {
  if (!ticker) return false;
  return getWatchlist().some(w => w.ticker === ticker);
}

function getWatchlist() {
  return JSON.parse(localStorage.getItem('gooaye_wl') || '[]');
}

function addToWatchlist(ticker, name, market, fromEpisode) {
  const wl = getWatchlist();
  if (!wl.find(w => w.ticker === ticker)) {
    wl.push({ticker, name, market, fromEpisode, addedAt: new Date().toISOString().slice(0,10)});
    localStorage.setItem('gooaye_wl', JSON.stringify(wl));
    renderWatchlist();
  }
}

function removeFromWatchlist(ticker) {
  const wl = getWatchlist().filter(w => w.ticker !== ticker);
  localStorage.setItem('gooaye_wl', JSON.stringify(wl));
  renderWatchlist();
  // 同步更新當前頁面的按鈕狀態
  document.querySelectorAll('.wl-btn').forEach(btn => {
    if (btn.dataset.ticker === ticker) {
      btn.textContent = '⭐';
      btn.classList.remove('in-wl');
    }
  });
}

function renderWatchlist() {
  const wl = getWatchlist();
  const el = document.getElementById('tab-watchlist');
  if (!wl.length) {
    el.innerHTML = '<p class="wl-empty">點擊報告中的 ⭐ 加入自選股</p>';
    return;
  }
  el.innerHTML = wl.map(w => `
    <div class="wl-item">
      <div class="wl-top">
        <code class="ticker">${w.ticker}</code>
        <span class="market-tag">${w.market}</span>
        <a href="${chartUrl(w.ticker, w.market)}" target="_blank" class="chart-btn" title="看K線">
          <svg viewBox="0 0 20 20" fill="currentColor" width="14" height="14">
            <rect x="2" y="10" width="3" height="8" rx="1"/>
            <rect x="8.5" y="5" width="3" height="13" rx="1"/>
            <rect x="15" y="2" width="3" height="16" rx="1"/>
          </svg>
        </a>
      </div>
      <div class="wl-name">${w.name}</div>
      <div class="wl-from">來自 ${w.fromEpisode} · 加入 ${w.addedAt}</div>
      <button class="wl-remove" onclick="removeFromWatchlist('${w.ticker}')">✕ 移除</button>
    </div>
  `).join('');
}

function switchTab(tab) {
  document.getElementById('tab-episodes').style.display = tab === 'episodes' ? '' : 'none';
  document.getElementById('tab-watchlist').style.display = tab === 'watchlist' ? '' : 'none';
  document.querySelectorAll('.tab').forEach((t, i) => {
    t.classList.toggle('active', (i === 0) === (tab === 'episodes'));
  });
  if (tab === 'watchlist') renderWatchlist();
}

function toggleSidebar(force) {
  const sb = document.getElementById('sidebar');
  const ov = document.getElementById('overlay');
  const open = force !== undefined ? force : !sb.classList.contains('open');
  sb.classList.toggle('open', open);
  ov.classList.toggle('show', open);
}

// 初始化
showEpisode('EP647 _ 🍬');
renderWatchlist();
